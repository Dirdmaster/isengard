[package]
name = "isengard-dns"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Foundation crate for the isengard DNS resolver: hickory-backed authoritative + forwarding library and a thin static-zone binary."

[dependencies]
# async + ergonomics
anyhow.workspace = true
async-trait.workspace = true
tokio = { workspace = true }
tracing.workspace = true

# CLI for the thin binary
clap.workspace = true
tracing-subscriber.workspace = true

# zone-file deserialisation for the binary's StaticZoneSource loader
serde.workspace = true
serde_yaml.workspace = true
toml.workspace = true

# DNS stack. Workspace pins are 0.25 (see root Cargo.toml notes on MSRV vs 0.26).
hickory-proto.workspace = true
hickory-server.workspace = true
hickory-resolver.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Async test runtime is already pulled in via the main `tokio` workspace dep
# (features = ["full"]); no extra wiring needed here.
