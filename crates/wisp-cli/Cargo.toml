[package]
name = "wisp-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Wisp CLI: debugging and showcase binary for the wisp runtime"

[[bin]]
name = "wisp"
path = "src/main.rs"

[dependencies]
wisp = { path = "../wisp" }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
# Binary uses synchronous tracing only: no JSON layer, no tokio
# console. We pull in just `env-filter` + `fmt` so the start-time
# subscriber init does not spawn helper threads (the `clone3`
# invariant in `Runtime::start` wants a single-threaded process).
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }
nix = { version = "0.30", features = ["signal", "process"] }
serde_json = { workspace = true }
