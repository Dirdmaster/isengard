syntax = "proto3";

package isengard.v1;

// Controller-side service. Agents call into it.
//
// v1 wire surface, scoped for Phase 2 (Enroll + Sync only). Phase 3+ message
// variants are scaffolded as oneof fields so the schema stays stable.
service Controller {
  // One-shot at agent startup. Agent presents host metadata, receives a
  // controller-assigned ULID + the heartbeat interval the controller wants.
  rpc Enroll(EnrollRequest) returns (EnrollResponse);

  // Long-lived bidirectional stream. After enrolling, the agent opens this
  // stream once and reconnects on drop with exponential backoff.
  //
  //   client -> server: SyncHello (first frame), Heartbeat, then Phase 3+
  //   server -> client: HeartbeatAck, then Phase 3+ (Command, ConfigUpdate)
  rpc Sync(stream AgentMessage) returns (stream ControllerMessage);

  // Phase 14: agent rotates its mTLS client cert before expiry. Authenticated
  // by the existing cert presented on the connection.
  rpc RenewCert(RenewCertRequest) returns (RenewCertResponse);

  // v0.3.6: agent fetches an Isengard-managed secret value at container
  // start time. Authenticated by the agent's mTLS client cert; the
  // controller side decrypts on demand and returns the plaintext bytes.
  // Plaintext is never persisted on the agent: it lands in a tmpfs
  // mount inside the operator's workload container.
  rpc FetchSecret(FetchSecretRequest) returns (FetchSecretResponse);
}

// ============ ENROLL ============

message EnrollRequest {
  // Phase 14: replaces the bearer-token interceptor. Token is the
  // base32-encoded short-lived enrollment token minted by the controller.
  string token = 1;
  string hostname = 2;
  string os = 3;
  string version = 4;
}

message EnrollResponse {
  bytes host_id = 1;
  // Phase 14: cert bundle for mTLS.
  string agent_cert_pem = 2;
  string agent_key_pem = 3;
  string ca_root_pem = 4;
  uint32 heartbeat_interval_secs = 5;
}

message RenewCertRequest {
  // Phase 14 Bl-1 fix: host_id is intentionally omitted. The controller's
  // CertAuthInterceptor authenticates the caller via mTLS and the renew_cert
  // handler reads the host_id from the client cert's CN. Trusting a
  // request-body host_id allowed a horizontal-escalation attack where agent
  // A could request a fresh cert minted for agent B.
}

message RenewCertResponse {
  string agent_cert_pem = 1;
  string agent_key_pem = 2;
  // RFC3339
  string expires_at = 3;
}

// ============ SECRETS (v0.3.6) ============

// Agent -> controller: "I'm starting a container that needs the secret named
// `name`; please decrypt and ship me the bytes." Authenticated by the
// agent's mTLS client cert; the controller's interceptor already gated the
// connection. Plaintext is returned in `value`.
message FetchSecretRequest {
  string name = 1;
}

// Controller -> agent: secret value bytes plus the timestamp of last
// rotation, so the agent can avoid recreating containers when nothing has
// changed.
message FetchSecretResponse {
  // Raw value bytes. Treat as opaque; agents write to tmpfs without any
  // re-encoding (matches Docker / Kubernetes secret semantics).
  bytes value      = 1;
  // RFC3339; lets the agent skip work when the on-disk value is up to date.
  string updated_at = 2;
}

// ============ SYNC ============

message Event {
  string kind = 1;
  string occurred_at = 2;
  string summary = 3;
  optional string container_name = 4;
  optional string image = 5;
  optional string old_digest = 6;
  optional string new_digest = 7;
  optional string error = 8;
  optional string metadata_json = 9;
}

message AgentMessage {
  oneof payload {
    // First frame of every Sync stream. Identifies the agent post-enroll.
    SyncHello                hello                    = 1;
    Heartbeat                heartbeat                = 2;
    Event                    event                    = 3;
    ContainerLabelsReport    container_labels_report  = 4;
    ContainerLabelsRemoved   container_labels_removed = 5;
    // Phase 13B: log line emitted by the agent in response to a controller-
    // initiated `StartLogStream`. Multiplexed by `subscription_id`.
    LogChunk                 log_chunk                = 6;
    // v0.3c: agent reports a freshly imported (or refreshed) compose.yaml
    // for a stack so the controller can serve it on
    // `GET /api/v1/stacks/<id>/compose` without round-tripping to the host.
    StackComposeReport       stack_compose_report     = 7;
    // v0.3d: agent acknowledges a `WriteCompose` ControllerMessage.
    // Carries the request_id the controller minted so the dashboard's
    // PUT /api/v1/stacks/<id>/compose can resolve the right pending call.
    WriteComposeAck          write_compose_ack        = 8;
  }
}

message SyncHello {
  string agent_id = 1;
}

message StackInfo {
  string name = 1;
  // One of: "compose", "manual", "inferred".
  string source = 2;
  // Container names that belong to this stack on this host.
  repeated string services = 3;
}

message ServiceInfo {
  string name = 1;
  string image = 2;
  // One of: "running", "stopped", "restarting", "unknown".
  string state = 3;
  // Stack name this service belongs to (if any). Same value the agent reported
  // in the matching StackInfo.
  optional string stack = 4;
}

message PendingAction {
  uint64 id = 1;
  // One of: "force_update", "decommission".
  string kind = 2;
  // JSON-encoded HostActionKind payload.
  string payload_json = 3;
}

message Heartbeat {
  uint64 ts_ms = 1; // agent's local clock at send time
  repeated StackInfo stacks = 2;
  repeated ServiceInfo services = 3;
  // Phase 0.5 wisp: which runtime backend the agent is talking to
  // (`docker`, `wisp`, ...). Additive: empty string from older
  // agents is treated by the controller as `docker` (the only
  // backend prior to 0.5).
  string runtime_backend = 4;
  // Phase 0.18: one entry per runtime container observed on this host
  // during this tick. Containers ride alongside `services` for one
  // release; once the controller's container-first projection covers
  // every dashboard surface the `services` array can be retired.
  // Older agents that don't ship containers send an empty repeated;
  // older controllers that don't read containers ignore the field.
  repeated ContainerInfo containers = 5;
  // Phase 0.14: per-host gossiped labels (sourced from
  // `/etc/isengard/agent.toml` `[labels]` table and
  // `ISENGARD_LABEL_*` env vars) so the controller's placement
  // scheduler can match `where:` selectors. Field 6 (plan said 5
  // but containers already owns 5; documented in
  // 2026-05-15-placement-scheduler default-and-document log).
  // Empty map from older agents is fine; selectors that reference a
  // missing label simply do not match.
  map<string, string> labels = 6;
}

// Phase 0.18: per-container snapshot the agent stamps once per
// heartbeat. State vocabulary the agent emits is fixed: `running`,
// `restarting`, `paused`, `created`, `exited`, `dead`, `removing`.
// `unknown` is never emitted; if the agent can't read state it omits
// the container from the snapshot.
message ContainerInfo {
  string runtime_container_id = 1;
  string image                = 2;
  string command              = 3;
  string state                = 4;
  string status_message       = 5;
  string names                = 6;
  string stack                = 7;
  string service              = 8;
  int64  created_at_ms        = 9;
  // Agent's clock at the moment the snapshot was captured. The
  // controller uses min(server_now, observed_at_ms / 1000) for
  // last_seen_at so we don't trust a wildly skewed agent clock.
  int64  observed_at_ms       = 10;
}

message ControllerMessage {
  oneof payload {
    HeartbeatAck     heartbeat_ack     = 1;
    // Phase 3+: Command       command       = 2;
    // Phase 4+: ConfigUpdate  config_update = 3;
    ProxyConfig      proxy_config      = 4;
    AbortDeployment  abort_deployment  = 5;
    // Phase 13B: ask the agent to begin tailing a container's logs and
    // emit `LogChunk` AgentMessages tagged with the same subscription_id.
    StartLogStream   start_log_stream  = 6;
    // Phase 13B: cancel a previously started log subscription. Idempotent.
    StopLogStream    stop_log_stream   = 7;
    // v0.3d: dashboard "Save" -> controller -> agent: write the supplied
    // YAML to `/etc/isengard/stacks/<stack>/compose.yaml`. The agent fires
    // its own inotify path immediately after, which drives the reconcile
    // loop from the same code path as a `vim` save.
    WriteCompose     write_compose     = 8;
  }
}

// Controller → agent: cancel an in-flight blue-green deployment. The agent
// looks up the matching `CancellationToken` on the supervisor and fires it,
// driving the running [`Driver`] task into its abort path. Plan B 10f.
message AbortDeployment {
  string deployment_id = 1;
}

message HeartbeatAck {
  uint64 server_time_ms = 1;
  repeated PendingAction pending_actions = 2;
}

// ============ PROXY (Phase 8) ============

// How TLS is terminated for a given route.
//   EDGE   = TLS terminates upstream (or unencrypted), proxy passes through
//   ACME   = proxy obtains + manages a certificate via ACME (Let's Encrypt)
//   MANUAL = operator-supplied certificate stored on the host
enum TlsMode {
  TLS_MODE_UNSPECIFIED = 0;
  TLS_MODE_EDGE        = 1;
  TLS_MODE_ACME        = 2;
  TLS_MODE_MANUAL      = 3;
}

// Backend container the proxy forwards to.
message Upstream {
  string container_id   = 1;
  string container_ip   = 2;
  uint32 container_port = 3;
}

// Optional health check the proxy performs against the upstream.
// Empty `path` means TCP-only liveness (connect + close).
message Healthcheck {
  string path          = 1;
  uint32 interval_secs = 2;
}

// One public-hostname → upstream mapping plus the policy that surrounds it.
message RoutingRule {
  int64       id              = 1;
  string      public_hostname = 2;
  Upstream    upstream        = 3;
  TlsMode     tls_mode        = 4;
  Healthcheck healthcheck     = 5;
  // Adapter id ("none", "websocket", future protocol shims). "none" by default.
  string      adapter         = 6;
}

// Per-host proxy configuration knobs.
message ProxySettings {
  uint32 http_port           = 1;
  uint32 https_port          = 2;
  string acme_contact_email  = 3;
  // Sampling rate in [0, 1] for verbose access logs. 0 = none, 1 = all.
  double log_sample_rate     = 4;
}

// Full proxy configuration the controller pushes to an agent. Generation
// monotonically increases; agents may ignore older generations on reorder.
message ProxyConfig {
  string                host_id        = 1;
  uint64                generation     = 2;
  repeated RoutingRule  rules          = 3;
  ProxySettings         settings       = 4;
  // DNS-01 wildcard certs the controller has issued. Each agent installs
  // these in its boringssl cert resolver alongside any HTTP-01 per-host
  // certs it owns. Empty list = no wildcards configured (or the controller
  // hasn't issued one yet).
  repeated WildcardCert wildcard_certs = 5;
}

// Controller -> agent: a wildcard cert the controller obtained via DNS-01.
// Carries PEM material in-band on the existing Sync stream (mTLS-protected,
// so private key transit is over an authenticated, encrypted channel).
//
// `identifiers` is the full SAN list (e.g. `["*.vallee.casa", "vallee.casa"]`).
// The agent installs the cert under each identifier so SNI matches either
// the apex or any subdomain covered by the wildcard.
message WildcardCert {
  repeated string identifiers = 1;
  string          cert_pem    = 2;
  string          key_pem     = 3;
}

// Agent → controller: container metadata snapshot used to derive routing rules
// from labels (e.g. `isengard.proxy.host=blog.example.com`).
message ContainerLabelsReport {
  string              container_id   = 1;
  string              container_name = 2;
  string              image          = 3;
  map<string, string> labels         = 4;
}

// Agent → controller: previously reported container is gone.
message ContainerLabelsRemoved {
  string container_id = 1;
}

// Controller -> agent (v0.3d): write the supplied YAML to the host's
// `/etc/isengard/stacks/<stack_name>/compose.yaml`, refreshing the sibling
// `meta.toml` on success. The agent's inotify watcher will see the
// rename and trigger the reconcile loop just like a `vim` save would.
//
// `expected_sha256` is the file hash the dashboard saw when it loaded
// the editor. The agent compares against the on-disk hash before
// writing; mismatch -> `WriteComposeAck` with `kind = CONFLICT`.
//
// `force = true` skips the conflict check (used by the dashboard's
// "Force overwrite" CTA). Defaults to false.
message WriteCompose {
  string request_id      = 1;
  string stack_name      = 2;
  string compose_yaml    = 3;
  string expected_sha256 = 4;
  bool   force           = 5;
  // Phase 0.13: verbatim stack.toml. Empty when the operator deploys a
  // compose-only stack (legacy path). Persisted on the agent at
  // /etc/isengard/stacks/<name>/stack.toml alongside compose.yml. The
  // agent does NOT parse it; behavior is driven by the explicit
  // `secrets` and `hooks` fields below.
  string manifest_toml   = 6;
  // Phase 0.13: per-stack secret names to mount into every service in
  // the stack. Values arrive via the v0.3.6 FetchSecret RPC.
  repeated string secrets = 7;
  // Phase 0.13: lifecycle hooks (pre-deploy, post-deploy, failure)
  // executed on the host (NOT inside any container).
  repeated LifecycleHook hooks = 8;
  // Phase 0.13: controller-minted ULID per deploy. Threaded into hook
  // env as ISENGARD_DEPLOYMENT_ID; written to the audit row for this
  // deploy. Pre-0.13 controllers leave this empty; pre-0.13 agents
  // ignore it.
  string deployment_id   = 9;
}

// Phase 0.13: single lifecycle hook entry. cmd[0] is the program;
// cmd[1..] the args. Agent spawns with cwd =
// /etc/isengard/stacks/<stack>/, layered env per spec
// (ISENGARD_STACK, ISENGARD_HOST_ID, ISENGARD_DEPLOYMENT_ID,
// ISENGARD_HOOK_EVENT, ISENGARD_MANIFEST_PATH; failure hook also
// receives ISENGARD_FAILURE_REASON and ISENGARD_FAILURE_DETAIL).
// timeout_ms enforced via tokio::time::timeout; SIGTERM, then SIGKILL
// after 5s on expiry. on_error is abort (default) or continue.
message LifecycleHook {
  string on          = 1;
  repeated string cmd = 2;
  uint64 timeout_ms  = 3;
  string on_error    = 4;
}

// Agent -> controller (v0.3d): outcome of a `WriteCompose`. The controller
// resolves the pending dashboard PUT keyed by `request_id`.
message WriteComposeAck {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_OK          = 1;
    // On-disk hash didn't match `expected_sha256`. `current_sha256` and
    // `current_yaml` carry the truth so the dashboard can show a diff.
    KIND_CONFLICT    = 2;
    // Anything else: I/O error, parse failure, etc. `error` is a one-line
    // human-readable message.
    KIND_ERROR       = 3;
  }
  string request_id     = 1;
  Kind   kind           = 2;
  string error          = 3;
  string current_sha256 = 4;
  string current_yaml   = 5;
  // Hash of the YAML the agent just wrote. Echoed back so the dashboard
  // can use it as the next If-Match.
  string written_sha256 = 6;
}

// Agent -> controller (v0.3c): imported compose.yaml for a stack on this
// host. Sent once on first discovery; subsequent reports overwrite the
// stored copy. The controller persists it to the `stacks.compose_yaml`
// column and serves it from `GET /api/v1/stacks/<id>/compose`.
message StackComposeReport {
  // Stack name as reported in `Heartbeat.stacks[].name`.
  string stack_name = 1;
  // YAML body. Raw text, no compression. Generated by the agent's
  // `compose_export::build_compose`.
  string compose_yaml = 2;
  // sha256 hex of `compose_yaml`. Lets the controller dedupe identical
  // re-reports across reconnects without parsing.
  string sha256 = 3;
  // RFC3339 timestamp when the agent wrote this YAML to disk. Echoed
  // straight through to the dashboard so users see "imported at X".
  string imported_at = 4;
}

// ============ LOGS (Phase 13B) ============

// Controller → agent: open a `docker logs -f` style tail on `container_name`
// and stream chunks back tagged with `subscription_id`. The agent uses bollard
// (`containers.logs(LogsOptions { follow:true, stdout:true, stderr:true,
// timestamps:true, tail })`) and emits one `AgentMessage::LogChunk` per line.
message StartLogStream {
  string subscription_id = 1; // controller-issued opaque id (ULID string)
  string container_name  = 2;
  uint32 tail            = 3; // initial backfill size; 0 = none
  bool   follow          = 4; // true = continuous stream
}

// Controller → agent: cancel a previously started subscription. Idempotent.
message StopLogStream {
  string subscription_id = 1;
}

// Agent → controller: one log line, or a control frame for the multiplexed
// subscription identified by `subscription_id`.
message LogChunk {
  // Frame kind. Backfill / Line carry an actual line; Dropped carries a count
  // of lines lost to backpressure since the last successful send; Unavailable
  // carries a reason and ends the stream.
  enum Kind {
    KIND_UNSPECIFIED  = 0;
    KIND_BACKFILL     = 1;
    KIND_LINE         = 2;
    KIND_DROPPED      = 3;
    KIND_UNAVAILABLE  = 4;
  }
  string subscription_id = 1;
  Kind   kind            = 2;
  // RFC3339 timestamp when the daemon emitted the line (timestamps=true). Set
  // for KIND_BACKFILL / KIND_LINE; empty otherwise.
  string occurred_at     = 3;
  // "stdout" or "stderr"; empty for non-line frames.
  string stream          = 4;
  // The actual log line, UTF-8 (lossy decode of non-UTF8 bytes), trailing
  // newline stripped.
  string line            = 5;
  // Populated for KIND_DROPPED.
  uint32 dropped         = 6;
  // Populated for KIND_DROPPED / KIND_UNAVAILABLE.
  string reason          = 7;
}
