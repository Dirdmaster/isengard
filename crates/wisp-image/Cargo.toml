[package]
name = "wisp-image"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Wisp image library: pull, store, extract OCI images for wisp-runtime (Phase 0.2)"

[dependencies]
# Shared types with the runtime crate. Path-only: this crate is internal to
# the workspace and never published independently of wisp.
wisp = { path = "../wisp" }

# OCI spec parsing for image manifests + image configuration. Pinned to the
# same 0.9.x line as `wisp` so the two crates agree on type identity for
# `oci_spec::runtime::Spec` and friends. We pull the `image` feature
# explicitly here; `wisp` only needs `runtime`.
oci-spec = { version = "0.9", default-features = false, features = ["image", "runtime"] }

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
sha2.workspace = true
hex.workspace = true

# Reference-string parsing helper. Used by Display + parse to handle
# registry/repo/tag/digest decomposition without re-rolling RFC-3986 parsing.
url = "2.5"

# File locking for the content store. The store is on-disk and must
# survive concurrent `wisp run --image` invocations. fs2 wraps flock
# (Unix) / LockFileEx (Windows) over an open File handle.
fs2 = "0.4"

# Atomic write helper. `NamedTempFile::persist` does the rename(2) so
# readers never observe partial blob writes. Already a workspace dev-dep
# (used by Phase 12 backup tests); promoted to a regular dep here
# because the store relies on it at runtime.
tempfile.workspace = true

# HTTP client for registry pulls. Blocking flavour: the wisp-image
# pull path is synchronous (no calling-side runtime), and the OCI
# distribution API is request-per-blob with no streaming idioms that
# benefit from async. rustls-tls keeps us off OpenSSL; json + stream
# features cover the auth realm response and chunked blob bodies.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "stream"] }

[dev-dependencies]
tempfile.workspace = true
# wiremock is async-only; the test target spins up a small tokio
# runtime per test even though the production code path is blocking.
# rt + macros are the minimum needed for #[tokio::test].
wiremock.workspace = true
tokio = { version = "1", features = ["macros", "rt"] }
