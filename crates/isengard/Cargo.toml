[package]
name = "isengard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Isengard container management platform — single binary, controller and agent modes"

[[bin]]
name = "isengard"
path = "src/main.rs"

[features]
default = ["dev", "tailscale"]
# `dev`: compiles in a no-op plugin so the host has something to load while
# real plugins (updater, dashboard, notifier) are not yet implemented. Removed
# from the default feature set when those land.
dev = []
# `tailscale`: links the tailscale NetworkingAdapter (CLI-driven). On by default;
# the adapter is inert unless an agent picks it via config.
tailscale = ["dep:isengard-plugin-networking-tailscale"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
inventory.workspace = true
isengard-agent.workspace = true
isengard-controller.workspace = true
isengard-core.workspace = true
isengard-plugin-dashboard.workspace = true
isengard-plugin-networking-none.workspace = true
isengard-plugin-networking-tailscale = { workspace = true, optional = true }
isengard-plugin-notifier.workspace = true
isengard-plugin-updater.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
assert_cmd = "2.0.16"
predicates = "3.1.3"
