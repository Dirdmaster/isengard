[package]
name = "isengard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Isengard container management platform — single binary, controller and agent modes"

[[bin]]
name = "isengard"
path = "src/main.rs"

[features]
default = ["dev", "tailscale", "cf-tunnel"]
# `dev`: compiles in a no-op plugin so the host has something to load while
# real plugins (updater, dashboard, notifier) are not yet implemented. Removed
# from the default feature set when those land.
dev = []
# `tailscale`: links the tailscale NetworkingAdapter (CLI-driven). On by default;
# the adapter is inert unless an agent picks it via config.
tailscale = ["dep:isengard-plugin-networking-tailscale"]
# `cf-tunnel`: links the Cloudflare Tunnel NetworkingAdapter. On by default;
# the adapter is inert unless an agent picks it via config.
cf-tunnel = ["dep:isengard-plugin-networking-cf-tunnel"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
hex = "0.4"
humantime = "2.1"
if-addrs = { workspace = true }
cliclack = { workspace = true }
inventory.workspace = true
rand = { workspace = true }
# `update` subcommand (Phase 0.18): GitHub Releases JSON + sha256 fetch.
# `serde` is needed for the `#[derive(Deserialize)]` on the API response shape.
reqwest = { workspace = true }
serde = { workspace = true }
# SemVer comparison for `isengard update`'s already-on-target check, so
# `0.5.1` matches `v0.5.1+meta` and `-alpha` builds never match a stable
# release tag.
semver = { workspace = true }
sha2 = { workspace = true }
which = { workspace = true }
isengard-agent.workspace = true
# Direct rustls dep: main.rs installs the default CryptoProvider at startup
# (required since instant-acme 0.8 pulled in rustls-platform-verifier).
rustls = { version = "0.23", default-features = false, features = ["ring"] }
isengard-controller.workspace = true
isengard-core.workspace = true
isengard-plugin-backup.workspace = true
isengard-plugin-dashboard.workspace = true
isengard-plugin-networking-none.workspace = true
isengard-plugin-networking-tailscale = { workspace = true, optional = true }
isengard-plugin-networking-cf-tunnel = { workspace = true, optional = true }
isengard-plugin-notifier.workspace = true
isengard-plugin-updater.workspace = true
isengard-plugin-webhooks.workspace = true
isengard-storage.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true
ulid = { workspace = true }

[dev-dependencies]
assert_cmd = "2.0.16"
predicates = "3.1.3"
# `update_e2e` integration test: spawn a wiremock server to stand in
# for the GitHub Releases API + asset download, then assert the
# `isengard update --check` and `--yes` flows hit the right URLs.
wiremock = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
sha2 = { workspace = true }
hex = "0.4"
