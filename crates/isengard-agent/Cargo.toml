[package]
name = "isengard-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "Agent-mode runtime"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
bollard.workspace = true
bytes = "1"
chrono.workspace = true
futures-util.workspace = true
hex.workspace = true
hostname.workspace = true
if-addrs.workspace = true
instant-acme.workspace = true
isengard-core.workspace = true
isengard-proto.workspace = true
isengard-storage = { workspace = true }
mdns-sd.workspace = true
notify = { workspace = true }
pingora-core = { workspace = true }
pingora-http = "0.8"
pingora-proxy = { workspace = true }
pingora-boringssl = "0.8"
rcgen = "0.13"
# self-update: download a new musl binary, verify sha256,
# atomic-rename, trigger systemctl restart. Plain GET, no JSON.
reqwest = { workspace = true }
# Pre-enroll skip-verify tonic channel for GetCaPem RPC. We have no CA
# yet at that point: tonic's `ClientTlsConfig` cannot express
# skip-verify, so we hand-roll a rustls config with a custom verifier
# and feed it to tonic via `connect_with_connector`. The fingerprint
# check the agent does next is what closes the trust loop.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http2", "tokio"] }
tower = { version = "0.5" }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio = { workspace = true }
# Phase 0.4 dispatch B2: WispBackend wraps a tokio broadcast channel
# in a Stream for `stream_events`. The `sync` feature gates the
# BroadcastStream wrapper. Existing call sites use only the default
# `time` feature, so adding `sync` here is purely additive.
tokio-stream = { version = "0.1.17", features = ["sync"] }
tokio-util = { workspace = true }
tonic.workspace = true
tracing.workspace = true
ulid = { workspace = true }
x509-parser.workspace = true

nix = { version = "0.30", default-features = false, features = ["signal"] }
oci-spec = { version = "0.9", default-features = false, features = ["runtime"] }
futures = "0.3"

[dev-dependencies]
data-encoding.workspace = true
tempfile = { workspace = true }
isengard-controller = { workspace = true }
# `fingerprint_enroll` test spawns an in-process tonic server with a
# stub `GetCaPem` impl so the pre-enroll fingerprint-verify path can
# be exercised in isolation. The test fixture needs to mint a self-
# signed cert + serve it over TLS.
rcgen = "0.13"
