[package]
name = "isengard-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "Agent-mode runtime"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
bollard.workspace = true
bytes = "1"
chrono.workspace = true
futures-util.workspace = true
hex.workspace = true
hostname.workspace = true
if-addrs.workspace = true
instant-acme.workspace = true
isengard-core.workspace = true
isengard-proto.workspace = true
isengard-storage = { workspace = true }
mdns-sd.workspace = true
notify = { workspace = true }
pingora-core = { workspace = true }
pingora-http = "0.8"
pingora-proxy = { workspace = true }
pingora-boringssl = "0.8"
rcgen = "0.13"
# Phase 0.8 self-update: download a new musl binary, verify sha256,
# atomic-rename, trigger systemctl restart. Plain GET, no JSON.
reqwest = { workspace = true }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio = { workspace = true }
# Phase 0.4 dispatch B2: WispBackend wraps a tokio broadcast channel
# in a Stream for `stream_events`. The `sync` feature gates the
# BroadcastStream wrapper. Existing call sites use only the default
# `time` feature, so adding `sync` here is purely additive.
tokio-stream = { version = "0.1.17", features = ["sync"] }
tokio-util = { workspace = true }
tonic.workspace = true
tracing.workspace = true
ulid = { workspace = true }
x509-parser.workspace = true

nix = { version = "0.30", default-features = false, features = ["signal"] }
oci-spec = { version = "0.9", default-features = false, features = ["runtime"] }
futures = "0.3"

[dev-dependencies]
tempfile = { workspace = true }
isengard-controller = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Tests must install a process-level rustls CryptoProvider before any TLS
# session is built. Required since instant-acme 0.8 transitively pulled in a
# rustls-platform-verifier path that panics without an explicit provider.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Track F Phase 3: `fingerprint_enroll` test spawns a wiremock server to
# stand in for the controller's `GET /api/v1/ca/pem` endpoint so the
# pre-enroll fingerprint-verify path can be exercised in isolation.
wiremock = { workspace = true }
