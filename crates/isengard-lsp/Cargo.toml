[package]
name = "isengard-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "Language server for Isengard stack.toml / isengard.toml / compose.yaml label vocabulary"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
# `isengard-manifest::parse_stack_manifest` / `parse_fleet_manifest`
# drive the diagnostic surface for stack.toml / isengard.toml. The
# `ManifestError::Toml { span, .. }` shape is what gives us file:line
# precision on the LSP side.
isengard-manifest.workspace = true
marked-yaml.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "io-std", "sync"] }
tower-lsp.workspace = true
tracing.workspace = true

[dev-dependencies]
futures = "0.3"
futures-util.workspace = true
tower = { version = "0.5", features = ["util"] }
