[package]
name = "isengard-controller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Controller-mode runtime"

[dependencies]
# v0.3.6 secrets store: ChaCha20-Poly1305 AEAD with the installer-issued
# 32-byte master key. The key is read from a bind-mounted file on boot
# (default /run/secrets/master.key); ciphertext is what's persisted in
# SQLite. AEAD's AAD is the secret name to defend against row swaps.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
anyhow.workspace = true
async-trait.workspace = true
base32.workspace = true
chrono.workspace = true
hex.workspace = true
http.workspace = true
isengard-core.workspace = true
isengard-proto.workspace = true
isengard-storage.workspace = true
rand.workspace = true
rcgen.workspace = true
secrecy = "0.10"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Phase 0.18: container heartbeat ingest hands a SqlitePool to the
# DAO functions exported by isengard-storage::containers.
sqlx = { workspace = true }
thiserror = { workspace = true }
time.workspace = true
tokio = { workspace = true }
tokio-stream.workspace = true
tonic.workspace = true
tonic-reflection.workspace = true
tower.workspace = true
tracing.workspace = true
ulid.workspace = true
x509-parser.workspace = true

# DNS-01 ACME flow with Cloudflare provider for wildcard cert issuance.
# `instant-acme` drives the RFC-8555 dance; `reqwest` posts TXT records to
# the CF v4 API.
instant-acme.workspace = true
reqwest.workspace = true

# v0.3b: zone-scoped DNS resolver. The server answers A queries inside the
# operator-configured zone; queries outside it return REFUSED so the OS
# resolver falls back upstream.
hickory-server.workspace = true
hickory-proto.workspace = true

[dev-dependencies]
tempfile = "3.14.0"
data-encoding.workspace = true
hickory-resolver.workspace = true
wiremock.workspace = true
# Tests must install a process-level rustls CryptoProvider before any TLS
# session is built. Required since instant-acme 0.8 transitively pulled in a
# rustls-platform-verifier path that panics without an explicit provider.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
