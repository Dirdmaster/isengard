[package]
name = "isd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Isengard operator CLI (talks to a controller)"

[[bin]]
name = "isd"
path = "src/main.rs"

[dependencies]
isengard-manifest.workspace = true
isd-runtime.workspace = true
anyhow.workspace = true
base64.workspace = true
# Track E: `isd init` calls bollard directly for volume create, exec, and the
# bootstrap container that seeds /state/master.key. Same version pin as
# isd-runtime.
bollard.workspace = true
chrono.workspace = true
clap.workspace = true
# v0.5.3: `tty` brings in `crossterm` so `Cell::fg` is available for the
# `isd ps` STATE column. comfy-table auto-suppresses ANSI when stdout is
# not a TTY, so piping into `jq`/`grep` stays clean.
comfy-table = { workspace = true, features = ["tty"] }
dirs.workspace = true
futures-util.workspace = true
hex.workspace = true
# Track F Phase 4: `isd join-token --ttl 15m` parses humantime durations and
# stringifies them back for the `isengard controller token mint --ttl` argv.
humantime = "2.1"
open.workspace = true
reqwest = { workspace = true, features = ["rustls-tls", "json"] }
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "io-std", "signal", "net", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
tokio-tungstenite.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
similar.workspace = true
tempfile.workspace = true

# v0.5.2: cliclack drives both `isd update` (plan / confirm UX) and
# `isd deploy --watch` (intro / outro chrome). Same renderer the
# `isengard init` wizard uses for visual consistency.
cliclack.workspace = true
# v0.5.3: `isd deploy --watch` renders one in-place progress line per
# service (docker-compose-up style) via indicatif MultiProgress. console
# is the underlying terminal abstraction (cursor / size / NO_COLOR).
# Versions pinned to whatever cliclack 0.5 already transitively pulls so
# we don't accidentally fork the dep tree.
indicatif = "0.18"
console = "0.16"
# v0.5.2: SemVer compare so `0.5.1 == 0.5.1+meta` and the dev pre-release
# (`0.1.0-alpha`) never short-circuits an update against a real tag.
semver.workspace = true

# `async-trait` is still required by `watch.rs` for the StackOperations
# trait abstraction.
async-trait.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
tempfile.workspace = true
# Phase 0.15: integration test for `secret --scope global` spins up two
# stub controllers (one wiremock instance per "fleet") and verifies the
# CLI fans the put/rm out across both.
wiremock.workspace = true
# v0.5.2 `isd update` end-to-end: spawn the built `isd` binary, point its
# update URLs at a wiremock, assert the in-place rename + sha verify path.
assert_cmd = "2.0.16"
predicates = "3.1.3"
