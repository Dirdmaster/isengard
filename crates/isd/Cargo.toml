[package]
name = "isd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Isengard operator CLI (talks to a controller)"

[[bin]]
name = "isd"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
comfy-table.workspace = true
dirs.workspace = true
futures-util.workspace = true
hex.workspace = true
open.workspace = true
reqwest = { workspace = true, features = ["rustls-tls", "json"] }
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "io-std", "signal", "net", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
tokio-tungstenite.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
similar.workspace = true
tempfile.workspace = true

# v0.3.5: gateway DNS + reverse proxy on the operator's Mac. Bridges browser
# traffic to containerized backends without fighting mDNS-in-Docker on macOS.
hickory-server.workspace = true
hickory-proto.workspace = true
async-trait.workspace = true
http-body-util = "0.1"
http.workspace = true
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
time.workspace = true

[dev-dependencies]
tempfile.workspace = true
