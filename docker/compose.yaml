# Isengard control plane: controller + agent on a Compose bridge network.
#
# Run from the project root:
#
#   docker compose -f docker/compose.yaml up -d controller
#   docker exec iso-controller isengard controller token mint --role agent
#   ISENGARD_ENROLL_TOKEN=<paste-token> docker compose -f docker/compose.yaml up -d agent
#
# Then `hello-stack.yaml` brings up an example managed stack on the host.
# Dashboard: http://127.0.0.1:9418

name: isengard

# Shared external network. Pingora (in the agent) and every operator-managed
# stack that wants to be routed must both join this network so they share an
# L3 fabric. Without it, the agent's pingora is on `isengard_default` while
# operator stacks (e.g. `hello-web` on `hello_default`) sit on a different
# bridge: routing rules get an IP the proxy can't reach, healthchecks evict,
# and clients get 503.
#
# This is the Traefik recipe (`proxy: external: true`). One-time setup on
# any host:
#
#   docker network create isengard-proxy
#   # or run `just net-up` (idempotent)
#
# Operator stacks opt-in by attaching to `isengard-proxy` via their own
# top-level `networks:` block (see `hello-stack.yaml` for a worked example).
networks:
  isengard-proxy:
    external: true
    name: isengard-proxy

services:
  controller:
    image: ghcr.io/weavers-engineering/isengard-controller:next
    # Images ship amd64 only (see docker/README.md "Architecture" section).
    # On Apple Silicon Macs this runs under Rosetta with a small perf hit;
    # native amd64 servers ignore the line. Drop it once we ship arm64.
    platform: linux/amd64
    container_name: iso-controller
    # The controller's self-signed cert is issued for SAN `controller.local`.
    # We expose that as a Compose network alias so the agent can reach
    # the controller AND the cert verifies. The literal Compose service
    # name `controller` ALSO resolves to the same container.
    hostname: controller.local
    networks:
      default:
        aliases:
          - controller.local
    ports:
      - "127.0.0.1:9417:9417"  # gRPC for agents
      - "127.0.0.1:9418:9418"  # dashboard HTTP
      # v0.3b DNS resolver. Bound to host loopback so only the host machine
      # (or a configured `/etc/resolver/<zone>` entry) can query it. Set
      # `ISENGARD_DNS_ZONE` below to enable; leave empty to skip the bind.
      # See docker/README.md "DNS resolver" section for client config.
      - "127.0.0.1:5300:5300/udp"
    volumes:
      - controller-state:/var/lib/isengard
      # v0.3.6 secrets store: 32-byte master key, mode 0600 on the host.
      # Dev contributors generate this once via:
      #   mkdir -p docker/secrets
      #   head -c 32 /dev/urandom > docker/secrets/master.key
      #   chmod 600 docker/secrets/master.key
      # The controller refuses to start without it. See docker/README.md
      # "Secrets" section.
      - ./secrets/master.key:/run/secrets/master.key:ro
    environment:
      ISENGARD_BACKUP_PASSPHRASE: manual-test-pass-2026
      RUST_LOG: info
      # Default value is /run/secrets/master.key; export on the line so
      # the lookup is auditable in `docker compose config` output.
      ISENGARD_MASTER_KEY_FILE: /run/secrets/master.key
      # v0.3b: empty disables the resolver. Set to a zone name (e.g. `iso`)
      # to expose `<host>.<zone>` resolution on UDP 5300. mDNS (`.local`)
      # is handled by the agent; this is the additive custom-zone path.
      ISENGARD_DNS_ZONE: ${ISENGARD_DNS_ZONE:-}
      ISENGARD_DNS_LISTEN: 0.0.0.0:5300
    command:
      - controller
      - --listen
      - 0.0.0.0:9417
      - --state-dir
      - /var/lib/isengard
    restart: unless-stopped

  agent:
    image: ghcr.io/weavers-engineering/isengard-agent:next
    platform: linux/amd64
    container_name: iso-agent
    # Run as root so the agent can connect to the host docker.sock, which
    # is owned by root:root with mode 0660. The agent already has full
    # docker-daemon access through that socket, which is equivalent to host
    # root anyway, so dropping to nonroot offers no real isolation here.
    user: "0:0"
    depends_on:
      - controller
    # Two networks: `default` carries controller-talk (the Compose-managed
    # network where the controller alias `controller.local` resolves);
    # `isengard-proxy` is the shared L3 fabric pingora uses to reach
    # operator stacks. Without the second attachment, every routing rule
    # would resolve a container IP that pingora can't reach across bridges.
    networks:
      - default
      - isengard-proxy
    # Publish pingora to host loopback. Privileged ports 80/443 are bound
    # by the docker engine, no sudo required from the operator. The proxy
    # itself listens on 8080/8443 inside the container; we do the host-side
    # mapping here so `curl -H "Host: hello.local" http://127.0.0.1/`
    # works without a port suffix.
    ports:
      - "127.0.0.1:80:8080"
      - "127.0.0.1:443:8443"
    volumes:
      - agent-state:/var/lib/isengard
      # Lets the agent manage containers running on the host's Docker daemon.
      # The agent's blue-green deploys, recreates, healthchecks all happen
      # against the host's containers via this socket.
      #
      # ${DOCKER_SOCK} defaults to the Docker Desktop / vanilla path. Override
      # it for non-Desktop runtimes by exporting before `docker compose up`:
      #   Docker Desktop:    /var/run/docker.sock              (default, works as-is)
      #   OrbStack:          export DOCKER_SOCK=$HOME/.orbstack/run/docker.sock
      #   Colima:            export DOCKER_SOCK=$HOME/.colima/default/docker.sock
      #   Rancher Desktop:   export DOCKER_SOCK=$HOME/.rd/docker.sock
      # Inside the container the path stays /var/run/docker.sock so the agent
      # finds it where bollard expects it.
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      # v0.3c compose import: per-stack `compose.yaml` lives here. The agent
      # reverse-engineers the YAML on first discovery of any
      # `isengard.enable=true` stack and writes
      # `/etc/isengard/stacks/<stack>/compose.yaml` + `meta.toml`. Bind-mounted
      # so the file persists across agent container restarts and is editable
      # from the host. v0.3d's compose-as-truth path will read from here.
      - /etc/isengard/stacks:/etc/isengard/stacks:rw
      # Controller's self-signed CA (Phase 14 mTLS). Export it once after the
      # controller starts:
      #   docker exec iso-controller isengard controller ca export > docker/ca.pem
      - ./ca.pem:/etc/iso/ca.pem:ro
    environment:
      # Mint via: docker exec iso-controller isengard controller token mint --role agent
      ISENGARD_ENROLL_TOKEN: ${ISENGARD_ENROLL_TOKEN:-}
      ISENGARD_CONTROLLER_CA_PEM_PATH: /etc/iso/ca.pem
      RUST_LOG: info
    command:
      - agent
      - --controller
      - https://controller.local:9417
      - --state-dir
      - /var/lib/isengard
    restart: unless-stopped

volumes:
  controller-state:
  agent-state:
