# Lefthook git hooks. https://lefthook.dev
#
# Activate locally:  `lefthook install`  (or `just install-hooks`)
# These run before `git push` and mirror the CI gates so failures are caught
# locally instead of round-tripping through GitHub Actions.
#
# WHY the `env -u GIT_DIR ...` prefix on every command:
# git sets GIT_DIR (and friends) in the environment when invoking hooks. The
# vars leak through lefthook into cargo and any tool that shells out to git.
# `cargo deny check` syncs its advisory database via `git -C <db> reset --hard
# FETCH_HEAD`. The `-C` flag changes cwd, but GIT_DIR overrides cwd-based repo
# discovery, so the reset hits THIS repo's worktree instead of the advisory db.
# The local branch silently loses its tip on every push. We saw it three times
# on 2026-05-04 to 2026-05-06 before tracking it down. Recovery was a manual
# `git reset --hard <sha>` from reflog. Fix: unset the leaked vars before any
# cargo invocation so subprocess git calls discover the right repo from cwd.
#
# Vars unset:
#   GIT_DIR             - main culprit
#   GIT_WORK_TREE       - companion to GIT_DIR
#   GIT_INDEX_FILE      - per-worktree index path
#   GIT_OBJECT_DIRECTORY- per-repo object dir
#   GIT_PREFIX          - cwd-relative path lefthook does not need
#   GIT_EXEC_PATH       - tells subprocess git where to find core helpers
#   GIT_EDITOR          - hooks set this to "true" which would break commits
#
# Cargo deny is the immediate offender; we apply the same prefix to every
# command in case other cargo subcommands grow git ops later.

pre-push:
  # Run sequentially so output is readable. All gates are fast (< 2 min total).
  parallel: false
  commands:
    fmt-check:
      run: env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_OBJECT_DIRECTORY -u GIT_PREFIX -u GIT_EXEC_PATH -u GIT_EDITOR cargo fmt --check
      tags: rust

    clippy:
      run: env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_OBJECT_DIRECTORY -u GIT_PREFIX -u GIT_EXEC_PATH -u GIT_EDITOR cargo clippy --workspace --all-targets -- -D warnings
      tags: rust

    rustdoc:
      run: env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_OBJECT_DIRECTORY -u GIT_PREFIX -u GIT_EXEC_PATH -u GIT_EDITOR RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --document-private-items
      tags: rust

    test:
      # Prefer nextest (faster, better output); fall back to cargo test.
      run: |
        env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_OBJECT_DIRECTORY -u GIT_PREFIX -u GIT_EXEC_PATH -u GIT_EDITOR sh -c '
          if command -v cargo-nextest >/dev/null 2>&1; then
            cargo nextest run --workspace
          else
            cargo test --workspace
          fi
        '
      tags: rust

    deny:
      # cargo-deny MUST run locally: CI runs the same gate, and a silent
      # local skip caused 3 red-CI pushes on 2026-04-30. If you don't have
      # cargo-deny installed, run `just install-hooks` (it bootstraps it)
      # or `cargo install cargo-deny`.
      run: |
        if ! command -v cargo-deny >/dev/null 2>&1; then
          echo "ERROR: cargo-deny is not installed."
          echo "  Install via: cargo install cargo-deny"
          echo "  Or:          just install-hooks"
          exit 1
        fi
        env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_OBJECT_DIRECTORY -u GIT_PREFIX -u GIT_EXEC_PATH -u GIT_EDITOR cargo deny check
      tags: rust

    linux-mirror:
      # Mac vs Linux divergence catches us repeatedly: cfg-gated unused
      # imports, clippy lint differences, dashboard build env, tests
      # that need docker.sock. Run the SAME gates inside the OrbStack
      # `wisp` VM (Linux + matches CI's ubuntu-latest closely:
      # docker.io installed, dockerd running) so we stop round-tripping
      # through GitHub Actions to find Linux-only failures.
      #
      # VM bootstrap (one-time):
      #   orb create ubuntu:noble wisp
      #   orb -m wisp -u root bash -c 'apt update && apt install -y docker.io build-essential pkg-config libssl-dev curl'
      #   orb -m wisp -u root bash -c 'systemctl enable --now docker && usermod -aG docker $(id -un 1000)'
      #   orb -m wisp bash -c 'curl --proto =https --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal'
      #
      # Skipped if OrbStack isn't installed or the `wisp` machine
      # doesn't exist (lone-Mac contributors aren't blocked but also
      # won't catch Linux-only issues; that risk is acceptable).
      #
      # Opt out for emergencies: LEFTHOOK_SKIP_LINUX_MIRROR=1 git push
      run: |
        if [ "${LEFTHOOK_SKIP_LINUX_MIRROR:-0}" = "1" ]; then
          echo "linux-mirror: skipped (LEFTHOOK_SKIP_LINUX_MIRROR=1)"
          exit 0
        fi
        if ! command -v orb >/dev/null 2>&1; then
          echo "linux-mirror: skipped (orb not installed; install OrbStack to catch Linux-only issues locally)"
          exit 0
        fi
        if ! orbctl list 2>/dev/null | awk '{print $1}' | grep -qx 'wisp'; then
          echo "linux-mirror: skipped (no 'wisp' OrbStack machine; see comment in lefthook.yml for bootstrap)"
          exit 0
        fi
        WORKTREE="$(pwd)"
        orb -m wisp bash -lc "
          set -euo pipefail
          source ~/.cargo/env
          cd '$WORKTREE'
          export RUSTFLAGS='-D warnings'
          export CARGO_BUILD_JOBS=2
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          if command -v cargo-nextest >/dev/null 2>&1; then
            cargo nextest run --workspace
          else
            cargo test --workspace
          fi
        "
      tags: rust

# Skip hooks on a single push by setting LEFTHOOK=0:
#   LEFTHOOK=0 git push
# (Don't make this a habit. The hooks exist for a reason.)
#
# Skip ONLY the Linux mirror (e.g., when wisp VM is unavailable):
#   LEFTHOOK_SKIP_LINUX_MIRROR=1 git push
