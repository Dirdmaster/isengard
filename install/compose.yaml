# Isengard production compose.
#
# This file is the production deployment recipe. Embedded in the `isd` binary
# via include_str so `isd init` ships a self-contained cluster bootstrap (one
# command brings up controller + first agent against any docker host the
# operator's docker context can reach).
#
# State lives in docker named volumes (iso-controller-state, iso-agent-state,
# iso-stacks). The master key is generated by `isd init` into the controller's
# state volume; the agent's CA-pin is passed via env (ISENGARD_CONTROLLER_CA_PEM_BASE64),
# minted from the controller via `docker exec iso-controller isengard controller ca export`.
# No host filesystem writes required.
#
# Operators who need ACME / Cloudflare DNS / backup passphrase / etc. can pass
# them via process env (compose interpolates ${VAR:-default} throughout this
# file) or via `docker compose --env-file <path>` after init.
#
# Bring up manually (without isd init):
#
#   docker network create isengard-proxy 2>/dev/null || true
#   docker compose -f compose.yaml up -d
#
# The dev recipe (with `build:`, source-tree mounts) lives at docker/compose.yaml.
# Don't mix the two.

name: isengard

# Shared external network. Pingora (in the agent) and every operator-managed
# stack that wants to be routed must both join this network so they share an
# L3 fabric. `isd init` / install.sh creates it before bringing the stack up;
# declaring it `external: true` here makes compose join the network instead of
# trying to create one named `isengard_isengard-proxy`.
networks:
  isengard-proxy:
    external: true
    name: isengard-proxy

# Named volumes. `isd init` creates iso-controller-state explicitly and writes
# the master key into it via a one-shot alpine bootstrap container before
# bringing the controller up. The other volumes are auto-created by compose.
volumes:
  iso-controller-state:
    name: iso-controller-state
  iso-agent-state:
    name: iso-agent-state
  iso-stacks:
    name: iso-stacks

services:
  controller:
    # Production tag. Override with ISENGARD_IMAGE_TAG=v0.3.5 (or a digest) in
    # /etc/isengard/isengard.env once we ship a tagged release. Pinning to a
    # tag is preferred over `:next` for reproducibility; `:next` is the rolling
    # default so a fresh install always gets the latest verified build.
    image: ghcr.io/weavers-engineering/isengard-controller:${ISENGARD_IMAGE_TAG:-next}
    # Images currently ship linux/amd64 only. Apple Silicon runs under Rosetta
    # with a small perf hit; native amd64 servers ignore the line. Drop once
    # arm64 manifests are healthy.
    platform: linux/amd64
    container_name: iso-controller
    labels:
      # Discovery anchor: isd does `docker ps --filter label=io.isengard.role=controller`
      # to find this container; constants live in crates/isd-runtime/src/discovery_labels.rs.
      io.isengard.role: controller
      # Schema version for the discovery contract; bump on breaking changes
      # (port relocation, auth path, label rename, ...).
      io.isengard.api.version: "1"
    # Run as root: the distroless image defaults to nonroot, but the
    # controller reads master.key (mode 0400 root) from the state volume.
    # A nonroot reader gets EACCES on boot and the secrets store fails
    # the boot check, crash-looping the controller. Same root threat-
    # model as the bootstrap one-shot and the agent's docker.sock access.
    user: "0:0"
    # The controller's self-signed cert is issued for SAN `controller.local`;
    # we expose that as a Compose network alias so the agent can reach the
    # controller over the default Compose network AND the cert verifies.
    hostname: controller.local
    networks:
      default:
        aliases:
          - controller.local
    ports:
      # gRPC for agents. Bound to host loopback in production: agents on
      # remote hosts should reach the controller via Cloudflare Tunnel /
      # reverse proxy, NOT this raw port. To expose publicly, set
      # ISENGARD_CONTROLLER_GRPC_BIND=0.0.0.0 in isengard.env.
      - "${ISENGARD_CONTROLLER_GRPC_BIND:-127.0.0.1}:9417:9417"
      # Dashboard HTTP. Same logic: keep on loopback, front with a tunnel.
      - "${ISENGARD_CONTROLLER_HTTP_BIND:-127.0.0.1}:9418:9418"
      # DNS resolver (v0.3b). Empty ISENGARD_DNS_ZONE disables the responder
      # but the bind stays free. Re-publish as 0.0.0.0:53 only after you've
      # confirmed nothing else on the host (systemd-resolved, dnsmasq) holds
      # the port.
      - "${ISENGARD_CONTROLLER_DNS_BIND:-127.0.0.1}:5300:5300/udp"
    volumes:
      # Named volume carrying everything important: master.key, CA, sqlite,
      # certs, audit log. `isd init` generates the master key into this volume
      # via a one-shot alpine bootstrap container before bringing the
      # controller up. Backup: `docker run --rm -v iso-controller-state:/src
      # -v $PWD:/dst alpine tar czf /dst/state.tgz -C /src .`
      - iso-controller-state:/var/lib/isengard
    environment:
      # Default to a structured log level appropriate for production. Override
      # to `debug` in isengard.env for short-term troubleshooting.
      RUST_LOG: ${RUST_LOG:-info}
      # Empty disables the resolver. Set to a zone name (e.g. `iso`) to
      # expose <host>.<zone> resolution on UDP 5300. mDNS (.local) is handled
      # by the agent; this is the additive custom-zone path.
      ISENGARD_DNS_ZONE: ${ISENGARD_DNS_ZONE:-}
      ISENGARD_DNS_LISTEN: 0.0.0.0:5300
      # Where the controller looks for the raw 32-byte master key. Lives
      # inside the iso-controller-state volume next to sqlite and CA state.
      # `isd init` writes it here via the bootstrap container; the
      # controller reads once at boot and refuses to start without it.
      ISENGARD_MASTER_KEY_FILE: /var/lib/isengard/master.key
    command:
      - controller
      - --listen
      - 0.0.0.0:9417
      - --state-dir
      - /var/lib/isengard
    restart: unless-stopped

  agent:
    image: ghcr.io/weavers-engineering/isengard-agent:${ISENGARD_IMAGE_TAG:-next}
    platform: linux/amd64
    container_name: iso-agent
    # Run as root so the agent can connect to the host docker.sock, which is
    # owned by root:root with mode 0660. Already has full docker-daemon access
    # via that socket (equivalent to host root); dropping to nonroot offers no
    # real isolation.
    user: "0:0"
    depends_on:
      - controller
    networks:
      # `default` carries controller-talk; `isengard-proxy` is the shared L3
      # fabric pingora uses to reach operator stacks. Without the second
      # attachment, every routing rule resolves a container IP that pingora
      # can't reach across bridges.
      - default
      - isengard-proxy
    ports:
      # Pingora published on host 80/443 in production. Override the bind via
      # ISENGARD_PROXY_BIND if a host firewall / reverse proxy needs them on
      # a specific interface.
      - "${ISENGARD_PROXY_BIND:-0.0.0.0}:80:8080"
      - "${ISENGARD_PROXY_BIND:-0.0.0.0}:443:8443"
    volumes:
      # Agent state (Phase 14 client cert + key, agent.json, runtime cache).
      - iso-agent-state:/var/lib/isengard
      # Lets the agent manage containers running on the host's Docker daemon.
      # ${DOCKER_SOCK} defaults to the standard Linux path; override via env
      # for non-Desktop runtimes. Inside the container the path stays
      # /var/run/docker.sock so bollard finds it.
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      # Per-stack compose.yaml + meta.toml. The agent reverse-engineers YAML
      # on first discovery of any `isengard.enable=true` stack. Operators
      # who want host-editable stack files can override this with a bind-mount
      # in a docker compose override file.
      - iso-stacks:/etc/isengard/stacks:rw
    environment:
      # Mint via:
      #   docker exec iso-controller isengard controller token mint --role agent
      # `isd init` does this for the first enrolment automatically, passing
      # both the token and the controller CA via env interpolation.
      ISENGARD_ENROLL_TOKEN: ${ISENGARD_ENROLL_TOKEN:-}
      # CA-pin for the bootstrap channel. The agent supports BOTH a file
      # path (ISENGARD_CONTROLLER_CA_PEM_PATH) and inline base64 (this var,
      # crates/isengard-agent/src/enroll.rs:6-9). `isd init` exports the CA
      # from the running controller via `docker exec ... isengard controller
      # ca export`, base64-encodes, passes here.
      ISENGARD_CONTROLLER_CA_PEM_BASE64: ${ISENGARD_CONTROLLER_CA_PEM_BASE64:-}
      RUST_LOG: ${RUST_LOG:-info}
    command:
      - agent
      - --controller
      - https://controller.local:9417
      - --state-dir
      - /var/lib/isengard
    restart: unless-stopped
