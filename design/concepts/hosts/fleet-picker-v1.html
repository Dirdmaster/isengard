<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hosts · Fleet picker open v1 — concept</title>
  <link rel="stylesheet" href="../../tokens.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../tw-config.js"></script>
  <style>body{margin:0;font-family:var(--iso-font-sans)}.mono{font-family:var(--iso-font-mono)}</style>
</head>
<body class="bg-iso-bg-base text-iso-text-primary p-6">
<div class="w-[1440px] h-[900px] flex flex-col rounded-iso-xl border border-iso-border overflow-hidden bg-iso-bg-base relative">

  <header class="h-[52px] px-5 flex items-center gap-4 border-b border-iso-border shrink-0 relative z-20">
    <div class="flex items-center gap-2"><div class="w-2.5 h-2.5 rounded-full bg-iso-success"></div><span class="text-sm font-semibold">isengard</span></div>
    <div class="px-2.5 py-1 rounded-iso-sm bg-iso-bg-base border border-iso-info mono text-xs text-iso-text-primary flex items-center gap-1.5 relative">
      All fleets
      <svg class="w-3 h-3 text-iso-info" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <nav class="flex items-center">
      <a class="px-3 py-1.5 text-xs text-iso-text-faint">Home</a>
      <a class="px-3 py-1.5 text-xs font-medium text-iso-text-primary border-b-2 border-iso-info">Hosts</a>
      <a class="px-3 py-1.5 text-xs text-iso-text-faint">Stacks</a>
    </nav>
    <div class="flex-1"></div>
  </header>

  <!-- Background hosts (dimmed) -->
  <main class="flex-1 px-6 py-5 flex flex-col gap-3 opacity-30">
    <div class="rounded-iso-md bg-iso-bg-elevated h-12"></div>
    <div class="rounded-iso-md bg-iso-bg-elevated h-10"></div>
    <div class="rounded-iso-md bg-iso-bg-elevated h-10"></div>
    <div class="rounded-iso-md bg-iso-bg-elevated h-10"></div>
    <div class="rounded-iso-md bg-iso-bg-elevated h-10"></div>
  </main>

  <!-- Dropdown popover -->
  <div class="absolute top-[44px] left-[154px] z-30 w-[260px] rounded-iso-lg border border-iso-border bg-iso-bg-elevated shadow-2xl overflow-hidden">

    <div class="px-3 py-2 border-b border-iso-border flex items-center justify-between">
      <span class="text-[10px] font-semibold tracking-wider text-iso-text-muted">FLEETS</span>
      <span class="text-[10px] text-iso-text-faint mono">5 hosts</span>
    </div>

    <!-- Scope toggle: All vs select -->
    <div class="px-2 pt-2 pb-1 flex items-center gap-1">
      <button class="flex-1 px-2.5 py-1 rounded-iso-sm bg-iso-info-soft border border-iso-info text-[11px] text-iso-info">All fleets</button>
      <button class="flex-1 px-2.5 py-1 rounded-iso-sm bg-iso-bg-base border border-iso-border text-[11px] text-iso-text-muted">Selected</button>
    </div>

    <div class="p-2 flex flex-col gap-0.5">
      <label class="px-2.5 py-1.5 rounded-iso-sm hover:bg-iso-bg-base flex items-center gap-2.5 text-xs">
        <div class="w-3.5 h-3.5 rounded-iso-sm bg-iso-info border-iso-info flex items-center justify-center">
          <svg class="w-2 h-2 text-iso-bg-base" fill="none" stroke="currentColor" stroke-width="3.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <span class="mono flex-1">default</span>
        <span class="text-[10px] text-iso-text-faint">0</span>
      </label>
      <label class="px-2.5 py-1.5 rounded-iso-sm hover:bg-iso-bg-base flex items-center gap-2.5 text-xs">
        <div class="w-3.5 h-3.5 rounded-iso-sm bg-iso-info border-iso-info flex items-center justify-center">
          <svg class="w-2 h-2 text-iso-bg-base" fill="none" stroke="currentColor" stroke-width="3.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <span class="mono flex-1">prod</span>
        <span class="text-[10px] text-iso-text-faint">2</span>
      </label>
      <label class="px-2.5 py-1.5 rounded-iso-sm hover:bg-iso-bg-base flex items-center gap-2.5 text-xs">
        <div class="w-3.5 h-3.5 rounded-iso-sm bg-iso-info border-iso-info flex items-center justify-center">
          <svg class="w-2 h-2 text-iso-bg-base" fill="none" stroke="currentColor" stroke-width="3.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <span class="mono flex-1">staging</span>
        <span class="text-[10px] text-iso-text-faint">1</span>
      </label>
      <label class="px-2.5 py-1.5 rounded-iso-sm hover:bg-iso-bg-base flex items-center gap-2.5 text-xs">
        <div class="w-3.5 h-3.5 rounded-iso-sm bg-iso-info border-iso-info flex items-center justify-center">
          <svg class="w-2 h-2 text-iso-bg-base" fill="none" stroke="currentColor" stroke-width="3.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <span class="mono flex-1">edge-pi</span>
        <span class="text-[10px] text-iso-text-faint">2</span>
      </label>
    </div>

    <div class="border-t border-iso-border p-2 flex flex-col gap-0.5">
      <button class="px-2.5 py-1.5 rounded-iso-sm hover:bg-iso-bg-base text-left text-xs text-iso-info flex items-center gap-2">
        <span class="text-base">+</span> New fleet…
      </button>
      <button class="px-2.5 py-1.5 rounded-iso-sm hover:bg-iso-bg-base text-left text-xs text-iso-text-muted flex items-center gap-2">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Manage in Settings
      </button>
    </div>

  </div>

  <footer class="h-9 px-4 flex items-center justify-between border-t border-iso-border text-[11px] text-iso-text-muted bg-iso-bg-elevated opacity-60">
    <span>controller v0.4.1 · 4 / 5 hosts up</span>
    <span class="mono">⌘K</span>
  </footer>

</div>
</body>
</html>
