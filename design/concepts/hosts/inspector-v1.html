<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hosts · Inspector slide-over v1 — concept</title>
  <link rel="stylesheet" href="../../tokens.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../tw-config.js"></script>
  <style>body{margin:0;font-family:var(--iso-font-sans)}.mono{font-family:var(--iso-font-mono)}</style>
</head>
<body class="bg-iso-bg-base text-iso-text-primary p-6">
<div class="w-[1440px] h-[900px] flex flex-col rounded-iso-xl border border-iso-border overflow-hidden bg-iso-bg-base relative">

  <!-- Background hosts page (dimmed) -->
  <header class="h-[52px] px-5 flex items-center gap-4 border-b border-iso-border shrink-0 opacity-30">
    <div class="flex items-center gap-2"><div class="w-2.5 h-2.5 rounded-full bg-iso-success"></div><span class="text-sm font-semibold">isengard</span></div>
    <nav class="flex items-center">
      <a class="px-3 py-1.5 text-xs text-iso-text-faint">Home</a>
      <a class="px-3 py-1.5 text-xs font-medium text-iso-text-primary border-b-2 border-iso-info">Hosts</a>
      <a class="px-3 py-1.5 text-xs text-iso-text-faint">Stacks</a>
    </nav>
  </header>
  <main class="flex-1 px-6 py-5 flex flex-col gap-3 opacity-25">
    <div class="rounded-iso-md bg-iso-bg-elevated h-12"></div>
    <div class="rounded-iso-md bg-iso-bg-elevated h-10"></div>
    <div class="rounded-iso-md bg-iso-bg-elevated h-10"></div>
    <div class="rounded-iso-md bg-iso-bg-elevated h-10"></div>
    <div class="rounded-iso-md bg-iso-bg-elevated h-10"></div>
  </main>

  <!-- Backdrop (light dim) -->
  <div class="absolute inset-0 bg-iso-bg-base opacity-30"></div>

  <!-- Slide-over from right -->
  <aside class="absolute top-[52px] right-0 bottom-9 w-[480px] bg-iso-bg-elevated border-l border-iso-border flex flex-col overflow-hidden shadow-2xl">

    <!-- Header -->
    <div class="px-5 py-4 border-b border-iso-border flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-2 h-2 rounded-full bg-iso-success"></div>
        <h2 class="text-base font-semibold mono">prod-04</h2>
        <span class="px-1.5 py-0.5 rounded-iso-sm bg-iso-bg-base border border-iso-border mono text-[10px] text-iso-text-secondary">prod</span>
      </div>
      <button class="text-iso-text-muted hover:text-iso-text-primary">✕</button>
    </div>

    <div class="flex-1 px-5 py-4 flex flex-col gap-5 overflow-auto">

      <!-- Identity -->
      <div class="flex flex-col gap-2">
        <span class="text-[10px] font-semibold tracking-wider text-iso-text-muted">IDENTITY</span>
        <div class="grid grid-cols-[100px_1fr] gap-y-1.5 text-[11px]">
          <span class="text-iso-text-muted">id</span><span class="mono text-iso-text-secondary">k8a_4u</span>
          <span class="text-iso-text-muted">arch</span><span class="mono text-iso-text-secondary">x86_64-alpha</span>
          <span class="text-iso-text-muted">agent</span><span class="mono text-iso-text-secondary">0.3.7-alpha</span>
          <span class="text-iso-text-muted">docker</span><span class="mono text-iso-text-secondary">27.4.0</span>
          <span class="text-iso-text-muted">kernel</span><span class="mono text-iso-text-secondary">2026-04-23 14:02:17</span>
          <span class="text-iso-text-muted">last seen</span><span class="text-iso-success">8s ago</span>
          <span class="text-iso-text-muted">fingerprint</span><span class="mono text-iso-text-secondary">sha256:cb91…b2d</span>
        </div>
      </div>

      <!-- Fleet -->
      <div class="flex flex-col gap-2">
        <span class="text-[10px] font-semibold tracking-wider text-iso-text-muted">FLEET</span>
        <div class="px-3 py-2 rounded-iso-md bg-iso-bg-base border border-iso-border flex items-center justify-between text-xs">
          <span class="mono">prod</span>
          <svg class="w-3 h-3 text-iso-text-muted" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>

      <!-- Activity -->
      <div class="flex flex-col gap-2">
        <span class="text-[10px] font-semibold tracking-wider text-iso-text-muted">ACTIVITY · 24H</span>
        <div class="rounded-iso-md bg-iso-bg-base border border-iso-border p-3 flex items-end gap-1 h-[64px]">
          <div class="flex-1 bg-iso-success/40 rounded-iso-sm" style="height: 30%"></div>
          <div class="flex-1 bg-iso-success/40 rounded-iso-sm" style="height: 50%"></div>
          <div class="flex-1 bg-iso-success/60 rounded-iso-sm" style="height: 60%"></div>
          <div class="flex-1 bg-iso-success/40 rounded-iso-sm" style="height: 35%"></div>
          <div class="flex-1 bg-iso-success/50 rounded-iso-sm" style="height: 45%"></div>
          <div class="flex-1 bg-iso-warn/60 rounded-iso-sm" style="height: 80%"></div>
          <div class="flex-1 bg-iso-success/60 rounded-iso-sm" style="height: 55%"></div>
          <div class="flex-1 bg-iso-success/70 rounded-iso-sm" style="height: 65%"></div>
          <div class="flex-1 bg-iso-success/60 rounded-iso-sm" style="height: 50%"></div>
          <div class="flex-1 bg-iso-success/50 rounded-iso-sm" style="height: 40%"></div>
          <div class="flex-1 bg-iso-success/60 rounded-iso-sm" style="height: 55%"></div>
          <div class="flex-1 bg-iso-success/70 rounded-iso-sm" style="height: 60%"></div>
        </div>
        <span class="text-[10px] text-iso-text-faint">347 events · 1 spike (14:31 cache pull error)</span>
      </div>

      <!-- Settings -->
      <div class="flex flex-col gap-2">
        <span class="text-[10px] font-semibold tracking-wider text-iso-text-muted">SETTINGS</span>
        <button class="px-3 py-2 rounded-iso-md bg-iso-bg-base border border-iso-border text-xs text-iso-text-secondary text-left flex items-center gap-2">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.4 0 4.6.9 6.3 2.5"/><polyline points="21 3 21 9 15 9"/></svg>
          Force update cycle
        </button>
        <button class="px-3 py-2 rounded-iso-md bg-iso-bg-base border border-iso-border text-xs text-iso-text-secondary text-left flex items-center gap-2">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
          Open shell
        </button>
        <button class="px-3 py-2 rounded-iso-md bg-iso-error/10 border border-iso-error text-xs text-iso-error text-left flex items-center gap-2">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          Decommission
        </button>
      </div>

    </div>

  </aside>

</div>
</body>
</html>
