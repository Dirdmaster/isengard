<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Modal · Service expose v1 — concept</title>
  <link rel="stylesheet" href="../../tokens.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../tw-config.js"></script>
  <style>body{margin:0;font-family:var(--iso-font-sans)}.mono{font-family:var(--iso-font-mono)}</style>
</head>
<body class="bg-iso-bg-base text-iso-text-primary p-6">
<div class="w-[1440px] h-[900px] flex items-center justify-center rounded-iso-xl border border-iso-border overflow-hidden bg-iso-bg-base relative">
  <div class="absolute inset-0 bg-iso-bg-overlay opacity-50"></div>

  <div class="relative w-[640px] rounded-iso-xl border border-iso-border bg-iso-bg-elevated shadow-2xl flex flex-col overflow-hidden">

    <div class="px-6 py-4 border-b border-iso-border flex items-center justify-between">
      <div class="flex flex-col gap-0.5">
        <h2 class="text-base font-semibold text-iso-text-primary">Expose service</h2>
        <span class="text-[11px] text-iso-text-muted">blog · web on prod-04 · port 8080</span>
      </div>
      <button class="w-7 h-7 rounded-iso-md flex items-center justify-center">
        <svg class="w-3.5 h-3.5 text-iso-text-muted" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="px-6 py-5 flex flex-col gap-5">

      <!-- Hostname -->
      <div class="flex flex-col gap-1.5">
        <label class="text-[11px] font-medium text-iso-text-muted tracking-wide">PUBLIC HOSTNAME</label>
        <div class="flex items-center gap-1.5">
          <div class="flex-1 px-3 py-2.5 rounded-iso-md bg-iso-bg-base border border-iso-info flex items-center gap-1.5">
            <span class="mono text-sm">blog</span>
            <span class="w-px h-4 bg-iso-text-primary"></span>
          </div>
          <span class="text-iso-text-muted text-sm">.</span>
          <div class="px-3 py-2.5 rounded-iso-md bg-iso-bg-base border border-iso-border flex items-center justify-between gap-2 min-w-[180px]">
            <span class="mono text-sm text-iso-text-primary">dirdmaster.dev</span>
            <svg class="w-3 h-3 text-iso-text-muted" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
        </div>
        <span class="text-[11px] text-iso-text-faint">DNS will be created automatically as a CNAME to your tunnel.</span>
      </div>

      <!-- Protocol -->
      <div class="flex flex-col gap-1.5">
        <label class="text-[11px] font-medium text-iso-text-muted tracking-wide">PROTOCOL</label>
        <div class="flex items-center gap-1.5">
          <span class="px-3 py-2 rounded-iso-md bg-iso-info-soft border border-iso-info text-xs font-medium text-iso-info">HTTPS</span>
          <span class="px-3 py-2 rounded-iso-md bg-iso-bg-base border border-iso-border text-xs text-iso-text-secondary">TCP</span>
        </div>
      </div>

      <!-- Adapter -->
      <div class="flex flex-col gap-1.5">
        <label class="text-[11px] font-medium text-iso-text-muted tracking-wide">ADAPTER</label>
        <div class="rounded-iso-md bg-iso-info-soft border border-iso-info p-3 flex items-center gap-3">
          <div class="w-8 h-8 rounded-iso-md bg-iso-bg-base flex items-center justify-center">
            <span class="mono text-[11px] font-bold text-iso-info">CF</span>
          </div>
          <div class="flex-1 flex flex-col gap-0.5">
            <span class="text-xs font-medium text-iso-text-primary">Cloudflare Tunnel</span>
            <span class="text-[11px] text-iso-text-muted">tunnel <span class="mono text-iso-text-secondary">02ab…f9c1</span> · 4 colos online</span>
          </div>
          <span class="text-[11px] text-iso-info">change…</span>
        </div>
      </div>

      <!-- Access -->
      <div class="flex flex-col gap-1.5">
        <label class="text-[11px] font-medium text-iso-text-muted tracking-wide">ACCESS</label>
        <div class="flex items-center gap-1.5">
          <span class="px-3 py-2 rounded-iso-md bg-iso-bg-base border border-iso-border text-xs text-iso-text-secondary">Public</span>
          <span class="px-3 py-2 rounded-iso-md bg-iso-info-soft border border-iso-info text-xs font-medium text-iso-info flex items-center gap-1.5">
            Cloudflare Access
            <span class="px-1 py-px rounded-iso-sm bg-iso-info text-iso-bg-base text-[9px] font-bold tracking-wide">REC</span>
          </span>
        </div>
      </div>

      <!-- Result preview -->
      <div class="rounded-iso-md bg-iso-bg-base border border-iso-border p-4 flex items-center gap-3">
        <svg class="w-4 h-4 text-iso-text-muted" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <div class="flex-1 flex flex-col gap-0.5">
          <span class="text-xs text-iso-text-muted">Will be reachable at</span>
          <span class="mono text-sm text-iso-success">https://blog.dirdmaster.dev</span>
        </div>
        <span class="text-[11px] text-iso-text-muted">~5 seconds</span>
      </div>
    </div>

    <div class="px-6 py-4 border-t border-iso-border bg-iso-bg-base flex items-center justify-end gap-2">
      <button class="px-2.5 py-1.5 rounded-iso-md bg-iso-bg-elevated border border-iso-border-strong text-xs text-iso-text-secondary">Cancel</button>
      <button class="px-3 py-1.5 rounded-iso-md bg-iso-success text-iso-bg-base text-xs font-medium">Expose now →</button>
    </div>
  </div>
</div>
</body>
</html>
