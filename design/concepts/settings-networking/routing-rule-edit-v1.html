<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Modal · Routing rule edit v1 — concept</title>
  <link rel="stylesheet" href="../../tokens.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../tw-config.js"></script>
  <style>body{margin:0;font-family:var(--iso-font-sans)}.mono{font-family:var(--iso-font-mono)}</style>
</head>
<body class="bg-iso-bg-base text-iso-text-primary p-6">
<div class="w-[1440px] h-[900px] flex items-center justify-center rounded-iso-xl border border-iso-border overflow-hidden bg-iso-bg-base relative">

  <!-- Dimmed page hint behind -->
  <div class="absolute inset-0 bg-iso-bg-overlay opacity-50"></div>

  <!-- Modal card -->
  <div class="relative w-[640px] rounded-iso-xl border border-iso-border bg-iso-bg-elevated shadow-2xl flex flex-col overflow-hidden">

    <!-- Modal header -->
    <div class="px-6 py-4 border-b border-iso-border flex items-center justify-between">
      <div class="flex flex-col gap-0.5">
        <h2 class="text-base font-semibold text-iso-text-primary">Edit routing rule</h2>
        <span class="text-[11px] text-iso-text-muted">blog.dirdmaster.dev → blog/web · UI source</span>
      </div>
      <button class="w-7 h-7 rounded-iso-md hover:bg-iso-bg-base flex items-center justify-center">
        <svg class="w-3.5 h-3.5 text-iso-text-muted" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <!-- Modal body -->
    <div class="px-6 py-5 flex flex-col gap-5">

      <div class="flex flex-col gap-1.5">
        <label class="text-[11px] font-medium text-iso-text-muted tracking-wide">PUBLIC HOSTNAME</label>
        <div class="px-3 py-2.5 rounded-iso-md bg-iso-bg-base border border-iso-info flex items-center gap-1.5">
          <span class="mono text-sm">blog.dirdmaster.dev</span>
          <span class="w-px h-4 bg-iso-text-primary"></span>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div class="flex flex-col gap-1.5">
          <label class="text-[11px] font-medium text-iso-text-muted tracking-wide">TARGET</label>
          <div class="px-3 py-2.5 rounded-iso-md bg-iso-bg-base border border-iso-border flex items-center justify-between">
            <span class="mono text-sm text-iso-text-primary">blog/web</span>
            <svg class="w-3 h-3 text-iso-text-muted" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-[11px] font-medium text-iso-text-muted tracking-wide">PORT</label>
          <div class="px-3 py-2.5 rounded-iso-md bg-iso-bg-base border border-iso-border">
            <span class="mono text-sm text-iso-text-primary">8080</span>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div class="flex flex-col gap-1.5">
          <label class="text-[11px] font-medium text-iso-text-muted tracking-wide">ADAPTER</label>
          <div class="px-3 py-2.5 rounded-iso-md bg-iso-bg-base border border-iso-border flex items-center justify-between">
            <span class="text-sm text-iso-text-primary">Cloudflare Tunnel</span>
            <svg class="w-3 h-3 text-iso-text-muted" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-[11px] font-medium text-iso-text-muted tracking-wide">TLS</label>
          <div class="flex items-center gap-1.5">
            <span class="px-2.5 py-1.5 rounded-iso-sm bg-iso-info-soft border border-iso-info mono text-[11px] text-iso-info">edge</span>
            <span class="px-2.5 py-1.5 rounded-iso-sm bg-iso-bg-base border border-iso-border mono text-[11px] text-iso-text-secondary">acme</span>
            <span class="px-2.5 py-1.5 rounded-iso-sm bg-iso-bg-base border border-iso-border mono text-[11px] text-iso-text-secondary">manual</span>
          </div>
        </div>
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-[11px] font-medium text-iso-text-muted tracking-wide">HEALTHCHECK PATH</label>
        <div class="flex items-center gap-2">
          <div class="flex-1 px-3 py-2.5 rounded-iso-md bg-iso-bg-base border border-iso-border">
            <span class="mono text-sm text-iso-text-primary">/health</span>
          </div>
          <div class="flex items-center gap-1.5">
            <span class="text-[11px] text-iso-text-muted">interval</span>
            <span class="mono text-[11px] text-iso-text-secondary px-2 py-1 rounded-iso-sm bg-iso-bg-base border border-iso-border">10s</span>
          </div>
        </div>
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-[11px] font-medium text-iso-text-muted tracking-wide">ACCESS</label>
        <div class="flex items-center gap-1.5">
          <span class="px-2.5 py-1.5 rounded-iso-sm bg-iso-bg-base border border-iso-border mono text-[11px] text-iso-text-secondary">public</span>
          <span class="px-2.5 py-1.5 rounded-iso-sm bg-iso-info-soft border border-iso-info mono text-[11px] text-iso-info">cf-access</span>
          <span class="px-2.5 py-1.5 rounded-iso-sm bg-iso-bg-base border border-iso-border mono text-[11px] text-iso-text-secondary">basic-auth</span>
          <span class="text-[11px] text-iso-text-faint ml-2">recommended for non-public services</span>
        </div>
      </div>

      <!-- Live preview hint -->
      <div class="rounded-iso-md bg-iso-bg-base border border-iso-border p-3 flex items-center gap-2.5">
        <svg class="w-3.5 h-3.5 text-iso-success" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        <span class="text-xs text-iso-text-secondary">Healthcheck succeeded · 8ms · last check 12s ago</span>
      </div>
    </div>

    <!-- Modal footer -->
    <div class="px-6 py-4 border-t border-iso-border bg-iso-bg-base flex items-center justify-between">
      <button class="px-2.5 py-1.5 rounded-iso-md text-xs text-iso-error">Delete rule</button>
      <div class="flex items-center gap-2">
        <button class="px-2.5 py-1.5 rounded-iso-md bg-iso-bg-elevated border border-iso-border-strong text-xs text-iso-text-secondary">Cancel</button>
        <button class="px-3 py-1.5 rounded-iso-md bg-iso-success text-iso-bg-base text-xs font-medium">Save changes</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
