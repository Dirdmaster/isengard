<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home · Cmd pane v1 — concept</title>
  <link rel="stylesheet" href="../../tokens.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../tw-config.js"></script>
  <style>body{margin:0;font-family:var(--iso-font-sans)}.mono{font-family:var(--iso-font-mono)}</style>
</head>
<body class="bg-iso-bg-base text-iso-text-primary p-6">
<div class="w-[1440px] h-[900px] flex flex-col rounded-iso-xl border border-iso-border overflow-hidden bg-iso-bg-base relative">

  <!-- Dimmed background: timeline + side panel (greyed out) -->
  <header class="h-[52px] px-5 flex items-center gap-4 border-b border-iso-border shrink-0 opacity-40">
    <div class="flex items-center gap-2"><div class="w-2.5 h-2.5 rounded-full bg-iso-success"></div><span class="text-sm font-semibold">isengard</span></div>
    <div class="px-2.5 py-1 rounded-iso-sm bg-iso-bg-elevated border border-iso-border mono text-xs text-iso-text-secondary">All fleets</div>
    <nav class="flex items-center">
      <a class="px-3 py-1.5 text-xs font-medium text-iso-text-primary border-b-2 border-iso-info">Home</a>
      <a class="px-3 py-1.5 text-xs text-iso-text-faint">Hosts</a>
      <a class="px-3 py-1.5 text-xs text-iso-text-faint">Stacks</a>
      <a class="px-3 py-1.5 text-xs text-iso-text-faint">Events</a>
    </nav>
  </header>

  <main class="flex-1 grid grid-cols-[2.4fr_1fr] overflow-hidden opacity-30">
    <div class="border-r border-iso-border p-5 flex flex-col gap-2">
      <div class="rounded-iso-md border border-iso-border bg-iso-bg-elevated h-12"></div>
      <div class="rounded-iso-md border border-iso-border bg-iso-bg-elevated h-12"></div>
      <div class="text-[10px] font-semibold tracking-wider text-iso-text-muted mt-2">TODAY · APRIL 26</div>
      <div class="rounded-iso-md bg-iso-bg-elevated h-7"></div>
      <div class="rounded-iso-md bg-iso-bg-elevated h-7"></div>
      <div class="rounded-iso-md bg-iso-bg-elevated h-7"></div>
      <div class="rounded-iso-md bg-iso-bg-elevated h-7"></div>
    </div>
    <aside class="bg-iso-bg-elevated/30 p-5 flex flex-col gap-2">
      <div class="text-[10px] font-semibold tracking-wider text-iso-text-muted">SELECTED EVENT</div>
      <div class="rounded-iso-lg bg-iso-bg-elevated h-32"></div>
    </aside>
  </main>

  <footer class="h-9 px-4 flex items-center justify-between border-t border-iso-border text-[11px] text-iso-text-muted bg-iso-bg-elevated opacity-40">
    <span>controller v0.4.1 · 4/4 hosts up</span>
    <span class="mono text-iso-info">⌘K</span>
  </footer>

  <!-- Cmd palette overlay -->
  <div class="absolute inset-0 flex items-start justify-center pt-[140px]">
    <div class="w-[640px] rounded-iso-xl border border-iso-border bg-iso-bg-elevated shadow-2xl overflow-hidden">

      <!-- Search input -->
      <div class="px-5 py-4 border-b border-iso-border flex items-center gap-3">
        <svg class="w-4 h-4 text-iso-text-muted" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input class="bg-transparent outline-none text-base mono text-iso-text-primary flex-1 caret-iso-info" value="prod " />
        <span class="px-1.5 py-0.5 rounded-iso-sm bg-iso-bg-base border border-iso-border mono text-[10px] text-iso-text-faint">esc</span>
      </div>

      <!-- Results -->
      <div class="max-h-[460px] overflow-auto">

        <div class="px-5 pt-3 pb-1 text-[10px] font-semibold tracking-wider text-iso-text-muted">HOSTS</div>
        <button class="w-full px-5 py-2 flex items-center gap-3 hover:bg-iso-bg-base bg-iso-info-soft border-l-2 border-iso-info">
          <svg class="w-4 h-4 text-iso-text-secondary" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="1"/><rect x="3" y="14" width="18" height="6" rx="1"/></svg>
          <div class="flex-1 text-left flex items-center gap-2">
            <span class="text-sm mono"><span class="text-iso-info">prod</span>-01</span>
            <span class="text-[10px] text-iso-text-muted">3 containers · seen 22s ago</span>
          </div>
          <span class="px-1.5 py-0.5 rounded-iso-sm bg-iso-bg-base border border-iso-border mono text-[10px] text-iso-text-faint">↵ open</span>
        </button>
        <button class="w-full px-5 py-2 flex items-center gap-3 hover:bg-iso-bg-base">
          <svg class="w-4 h-4 text-iso-text-faint" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="1"/><rect x="3" y="14" width="18" height="6" rx="1"/></svg>
          <div class="flex-1 text-left flex items-center gap-2">
            <span class="text-sm mono"><span class="text-iso-info">prod</span>-02</span>
            <span class="text-[10px] text-iso-text-muted">2 containers · ending tonight</span>
          </div>
        </button>

        <div class="px-5 pt-3 pb-1 text-[10px] font-semibold tracking-wider text-iso-text-muted">CONTAINERS</div>
        <button class="w-full px-5 py-2 flex items-center gap-3 hover:bg-iso-bg-base">
          <div class="w-2 h-2 rounded-full bg-iso-success"></div>
          <div class="flex-1 text-left flex items-center gap-2">
            <span class="text-sm mono">web on <span class="text-iso-info">prod</span>-01</span>
            <span class="text-[10px] text-iso-text-muted">nginx:1.25-alpine</span>
          </div>
        </button>
        <button class="w-full px-5 py-2 flex items-center gap-3 hover:bg-iso-bg-base">
          <div class="w-2 h-2 rounded-full bg-iso-warn"></div>
          <div class="flex-1 text-left flex items-center gap-2">
            <span class="text-sm mono">cache on <span class="text-iso-info">prod</span>-01</span>
            <span class="text-[10px] text-iso-text-muted">redis:7.2 · pull error</span>
          </div>
        </button>

        <div class="px-5 pt-3 pb-1 text-[10px] font-semibold tracking-wider text-iso-text-muted">ACTIONS</div>
        <button class="w-full px-5 py-2 flex items-center gap-3 hover:bg-iso-bg-base">
          <span class="text-iso-text-secondary text-base">⌘</span>
          <div class="flex-1 text-left flex items-center gap-2">
            <span class="text-sm">Open shell on <span class="mono text-iso-text-primary">web @ <span class="text-iso-info">prod</span>-01</span></span>
            <span class="text-[10px] text-iso-text-muted">⇧⌘ enter</span>
          </div>
        </button>
        <button class="w-full px-5 py-2 flex items-center gap-3 hover:bg-iso-bg-base">
          <span class="text-iso-text-secondary text-base">↻</span>
          <div class="flex-1 text-left flex items-center gap-2">
            <span class="text-sm">Force update cycle on <span class="mono text-iso-text-primary"><span class="text-iso-info">prod</span> fleet</span></span>
            <span class="text-[10px] text-iso-warn">confirm before</span>
          </div>
        </button>

      </div>

      <!-- Footer hints -->
      <div class="px-5 py-2.5 border-t border-iso-border flex items-center justify-between text-[10px] text-iso-text-muted bg-iso-bg-base/50">
        <div class="flex items-center gap-3 mono">
          <span><span class="text-iso-text-secondary">tab</span> autopath</span>
          <span><span class="text-iso-text-secondary">↑↓</span> navigate</span>
        </div>
        <div class="flex items-center gap-3 mono">
          <span><span class="text-iso-text-secondary">@</span> hosts</span>
          <span><span class="text-iso-text-secondary">$</span> stacks</span>
          <span><span class="text-iso-text-secondary">/</span> by name</span>
          <span><span class="text-iso-text-secondary">?</span> help</span>
        </div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
