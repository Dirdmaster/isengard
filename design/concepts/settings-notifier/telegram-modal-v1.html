<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Settings · Notifier · Telegram modal v1 — concept</title>
  <link rel="stylesheet" href="../../tokens.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../tw-config.js"></script>
  <style>body{margin:0;font-family:var(--iso-font-sans)}.mono{font-family:var(--iso-font-mono)}</style>
</head>
<body class="bg-iso-bg-base text-iso-text-primary p-6">
<div class="w-[1440px] h-[900px] flex items-center justify-center bg-iso-bg-base rounded-iso-xl border border-iso-border relative">

  <div class="absolute inset-0 bg-iso-bg-overlay opacity-50"></div>

  <div class="relative w-[560px] rounded-iso-xl border border-iso-border bg-iso-bg-elevated shadow-2xl">

    <!-- Header -->
    <div class="px-5 py-4 border-b border-iso-border flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-7 h-7 rounded-iso-md bg-iso-info-soft border border-iso-info/40 flex items-center justify-center">
          <svg class="w-4 h-4 text-iso-info" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.6 0 12 0zm5.6 8.2-1.9 8.8c-.1.7-.5.8-1 .5l-2.8-2.1-1.4 1.3c-.2.2-.3.3-.6.3l.2-2.9 5.2-4.7c.2-.2 0-.3-.3-.1L7.6 13l-2.8-.9c-.6-.2-.6-.6.1-.9l11-4.2c.5-.2 1 .1.7.9z"/></svg>
        </div>
        <h2 class="text-base font-semibold">Configure Telegram</h2>
      </div>
      <button class="text-iso-text-muted hover:text-iso-text-primary">✕</button>
    </div>

    <!-- Body -->
    <div class="px-5 py-5 flex flex-col gap-4">

      <div class="flex flex-col gap-1.5">
        <label class="text-[11px] font-medium text-iso-text-muted tracking-wide">BOT TOKEN</label>
        <div class="px-3 py-2 rounded-iso-md bg-iso-bg-base border border-iso-border flex items-center justify-between mono text-xs">
          <span>7894542210:AAEHBY...••••••</span>
          <button class="text-[10px] text-iso-info">Reveal</button>
        </div>
        <span class="text-[10px] text-iso-text-faint">From <span class="mono text-iso-text-secondary">@BotFather</span> · keep this secret.</span>
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-[11px] font-medium text-iso-text-muted tracking-wide">CHAT ID</label>
        <div class="px-3 py-2 rounded-iso-md bg-iso-bg-base border border-iso-border mono text-xs">1051234567890</div>
        <span class="text-[10px] text-iso-text-faint">Group or DM. Send <span class="mono text-iso-text-secondary">/start</span> to your bot first to get its ID.</span>
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-[11px] font-medium text-iso-text-muted tracking-wide">SUBSCRIBED TO EVENTS</label>
        <div class="flex flex-col gap-1.5 px-3 py-2.5 rounded-iso-md bg-iso-bg-base border border-iso-border">
          <label class="flex items-center gap-2.5 text-xs">
            <div class="w-3.5 h-3.5 rounded-iso-sm bg-iso-info border-iso-info flex items-center justify-center">
              <svg class="w-2 h-2 text-iso-bg-base" fill="none" stroke="currentColor" stroke-width="3.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <span class="mono">update.failed</span>
            <span class="text-[10px] text-iso-text-faint">— don't miss broken updates</span>
          </label>
          <label class="flex items-center gap-2.5 text-xs">
            <div class="w-3.5 h-3.5 rounded-iso-sm bg-iso-info border-iso-info flex items-center justify-center">
              <svg class="w-2 h-2 text-iso-bg-base" fill="none" stroke="currentColor" stroke-width="3.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <span class="mono">update.pending_approval</span>
            <span class="text-[10px] text-iso-text-faint">— callback delivered to chat</span>
          </label>
          <label class="flex items-center gap-2.5 text-xs">
            <div class="w-3.5 h-3.5 rounded-iso-sm border border-iso-border bg-iso-bg-base"></div>
            <span class="mono text-iso-text-muted">deployment.completed</span>
          </label>
          <label class="flex items-center gap-2.5 text-xs">
            <div class="w-3.5 h-3.5 rounded-iso-sm border border-iso-border bg-iso-bg-base"></div>
            <span class="mono text-iso-text-muted">agent.disconnect_long</span>
          </label>
        </div>
      </div>

      <div class="rounded-iso-md border border-iso-success/40 bg-iso-success-soft px-3 py-2.5 flex items-center gap-2">
        <svg class="w-4 h-4 text-iso-success shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        <span class="text-[11px] text-iso-success">Test message delivered to chat <span class="mono">1051234567890</span></span>
      </div>

    </div>

    <!-- Footer -->
    <div class="px-5 py-3 border-t border-iso-border flex items-center justify-between">
      <button class="px-3 py-1.5 rounded-iso-md bg-iso-bg-base border border-iso-border text-xs text-iso-text-secondary flex items-center gap-1.5">✈ Send test</button>
      <div class="flex items-center gap-2">
        <button class="px-3 py-1.5 rounded-iso-md text-xs text-iso-text-muted">Cancel</button>
        <button class="px-4 py-1.5 rounded-iso-md bg-iso-success text-iso-bg-base text-xs font-medium">Save</button>
      </div>
    </div>
  </div>

</div>
</body>
</html>
