[workspace]
resolver = "2"
members = [
    "crates/isengard",
    "crates/isd",
    "crates/isd-runtime",
    "crates/isengard-core",
    "crates/isengard-controller",
    "crates/isengard-agent",
    "crates/isengard-manifest",
    "crates/isengard-proto",
    "crates/isengard-storage",
    "crates/isengard-plugins/updater",
    "crates/isengard-plugins/dashboard",
    "crates/isengard-plugins/notifier",
    "crates/isengard-plugins/webhooks",
    "crates/isengard-plugins/backup",
    "crates/isengard-plugins/networking-none",
    "crates/isengard-plugins/networking-tailscale",
    "crates/isengard-plugins/networking-cf-tunnel",
]

[workspace.package]
version = "0.1.0-alpha"
edition = "2024"
rust-version = "1.86"
license = "MIT"
authors = ["Dirdmaster"]
repository = "https://github.com/Dirdmaster/isengard"
homepage = "https://isengard.app"

[workspace.dependencies]
# async runtime
tokio = { version = "1.42", features = ["full"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt", "io"] }
async-trait = "0.1.83"

# Track G Phase 5: encrypted backup pipeline (`isd backup` / `isd restore`).
# `age` 0.11 is the pure-Rust scrypt passphrase encryptor (`Encryptor::with_user_passphrase`).
# Pinned to 0.11 because 0.10 predates the current `secrecy` re-export
# surface and 0.11.x is the stable line; the conceptual API (wrap_output / finish,
# decrypt + Identity iterator) is what the spec calls for.
age = { version = "0.11", default-features = false }
# Track G Phase 5: S3-API backup destination (AWS, R2, MinIO, B2, Wasabi).
# `behavior-version-latest` silences the runtime warning the SDK prints when no
# behavior version is pinned, and locks our calls to the current contract.
# We deliberately use `default-https-client` (rustls + aws-lc via the modern
# hyper-1 path) instead of the SDK's `rustls` feature, which pulls in the
# `legacy-rustls-ring` flag and drags rustls 0.21 + rustls-webpki 0.101 into
# the tree (RUSTSEC-2026-0098 / 0099 / 0104). aws-lc satisfies the AWS rustls
# audit story without dropping us back to the deprecated 0.21 line.
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }

# plugin registration
inventory = "0.3.15"

# serialization
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"

# errors
anyhow = "1.0.94"
thiserror = "2.0.6"

# CLI
clap = { version = "4.5.23", features = ["derive", "env"] }

# logging
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "json"] }

# gRPC + protobuf
tonic = { version = "0.12.3", features = ["tls", "tls-native-roots"] }
tonic-build = "0.12.3"
tonic-reflection = "0.12.3"
prost = "0.13.4"
prost-types = "0.13.4"
tower = "0.5.2"
tokio-stream = "0.1.17"
http = "1"

# storage
sqlx = { version = "0.8.2", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "macros", "migrate", "chrono"] }
ulid = { version = "1.1.3", features = ["serde"] }
chrono = { version = "0.4.39", default-features = false, features = ["serde", "clock"] }
chrono-tz = { version = "0.10.4", default-features = false, features = ["std"] }
croner = "3.0"

# HTTP server (dashboard)
axum = { version = "0.8.1", default-features = false, features = ["http1", "http2", "tokio", "json", "ws", "macros", "query"] }

# reverse proxy (Pingora)
pingora-core = { version = "0.8", default-features = false, features = ["boringssl"] }
pingora-proxy = { version = "0.8", default-features = false, features = ["boringssl"] }

# embedded static assets (dashboard bundle)
rust-embed = { version = "8.5.0", features = ["compression"] }

# mime type detection for embedded asset serving
mime_guess = "2.0.5"

# crypto helpers
subtle = "2.6.1"
sha2 = "0.10"

# Base32 encoder/decoder (RFC 4648 unpadded). Used by the Track F join-token
# packer in `isengard-core::join_token`.
data-encoding = "2.6"

# YAML emitter for v0.3c compose import (deterministic key ordering).
serde_yaml = "0.9"

# TOML for sibling meta.toml records next to imported compose.yaml.
toml = "0.8"

# v0.3d: filesystem watcher (inotify on Linux, FSEvents on macOS) for the
# agent's compose-as-truth reconcile loop.
notify = "7"

# v0.3d: text diff for `isd diff` and the dashboard conflict banner.
similar = "2.6"
rcgen = { version = "0.13", default-features = false, features = ["pem", "x509-parser", "ring"] }
rand = "0.8"

# ACME client (RFC 8555). Used by the controller's DNS-01 flow for wildcard
# certificate issuance via Let's Encrypt. 0.8 is required because LE has begun
# returning challenge objects for unknown ChallengeType variants without a
# `token` field; 0.7's strict deserialization rejected the entire authz parse
# ("missing field `token`"). 0.8 added `#[serde(default)]` on token for
# forward-compat. Single source of truth for both controller + agent crates.
instant-acme = "0.8"
x509-parser = "0.16"
time = { version = "0.3", default-features = false, features = ["std"] }
ed25519-dalek = "2.1.1"
hex = "0.4.3"

# system info
hostname = "0.4.0"

# docker
bollard = { version = "0.18.1", default-features = false, features = ["ssl", "http", "pipe"] }

# HTTP client (used by updater to query registries)
reqwest = { version = "0.12.9", default-features = false, features = ["rustls-tls", "json"] }

# base64 (decode docker config auth blobs)
base64 = "0.22.1"

# base32 (encode short-lived enrollment tokens)
base32 = "0.5"

# user dirs (locate ~/.docker/config.json cross-platform)
dirs = "6.0.0"

# futures utilities (consume bollard pull streams)
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }

# semver parsing for the updater's Minor strategy (Phase 9e)
semver = "1.0"

# tempfile (test helpers)
tempfile = "3.14.0"

# HTTP mock server for tests
wiremock = "0.6.2"

# internal — path + version so cargo-deny doesn't flag these as wildcard deps
isengard-core = { path = "crates/isengard-core", version = "0.1.0-alpha" }
isengard-controller = { path = "crates/isengard-controller", version = "0.1.0-alpha" }
isd-runtime = { path = "crates/isd-runtime", version = "0.1.0-alpha" }
isengard-agent = { path = "crates/isengard-agent", version = "0.1.0-alpha" }
isengard-manifest = { path = "crates/isengard-manifest", version = "0.1.0-alpha" }
isengard-proto = { path = "crates/isengard-proto", version = "0.1.0-alpha" }
isengard-storage = { path = "crates/isengard-storage", version = "0.1.0-alpha" }
isengard-plugin-updater = { path = "crates/isengard-plugins/updater", version = "0.1.0-alpha" }
isengard-plugin-notifier = { path = "crates/isengard-plugins/notifier", version = "0.1.0-alpha" }
isengard-plugin-webhooks = { path = "crates/isengard-plugins/webhooks", version = "0.1.0-alpha" }
isengard-plugin-dashboard = { path = "crates/isengard-plugins/dashboard", version = "0.1.0-alpha" }
isengard-plugin-backup = { path = "crates/isengard-plugins/backup", version = "0.1.0-alpha" }
isengard-plugin-networking-none = { path = "crates/isengard-plugins/networking-none", version = "0.1.0-alpha" }
isengard-plugin-networking-tailscale = { path = "crates/isengard-plugins/networking-tailscale", version = "0.1.0-alpha" }
isengard-plugin-networking-cf-tunnel = { path = "crates/isengard-plugins/networking-cf-tunnel", version = "0.1.0-alpha" }

# external CLI lookup (used by tailscale adapter to verify `tailscale` binary)
which = "6"

# mDNS responder (v0.3a: agent advertises `*.local` records on the LAN)
mdns-sd = { version = "0.13", default-features = false, features = ["async"] }

# enumerate local network interfaces (v0.3a: pick advertising IPv4)
if-addrs = "0.13"

# CLI table rendering (v0.3a: `isd ps` pretty output)
comfy-table = { version = "7", default-features = false }

# open the OS default browser (v0.3a: `isd open <stack>`)
open = "5"

# websocket client for `isd logs -f` (v0.3a)
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-native-roots"] }

# read passwords / tokens without echoing to the terminal (v0.3a: `isd login`)
rpassword = "7"

# Phase 0.12: `cliclack` is the Rust port of the `@clack/prompts` library that
# every modern JS installer (`nuxi init`, `create-astro`, `create-svelte`,
# `pnpm create vite`, `npx shadcn init`, `create-t3-app`) uses. It owns the
# whole transcript shape (`┌`/`│`/`└` connector, `◇`/`◆` step glyphs, spinner
# rendering) so the installer reads as one connected pipe instead of a soup
# of independent widgets. `cliclack` vendors `console` + `indicatif` internally,
# so we no longer pull those as direct deps. Pinned tight so a transitive bump
# can't quietly change the look.
cliclack = "0.5"

# v0.3b: embedded DNS server hosted by the controller for a configurable zone
# (e.g. `*.iso`). Pinned to 0.25; 0.26+ requires Rust 1.88, the workspace
# MSRV is 1.86. RUSTSEC-2026-0119 is acknowledged in deny.toml; not
# exploitable in our deployment (resolver binds to LAN-only, agents are
# enrolled, no untrusted DNS traffic ingresses).
hickory-server = { version = "0.25", default-features = false, features = ["resolver"] }
hickory-proto = { version = "0.25", default-features = false }
hickory-resolver = { version = "0.25", default-features = false, features = ["tokio"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
