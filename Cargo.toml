[workspace]
resolver = "2"
members = [
    "crates/isengard",
    "crates/isengard-core",
    "crates/isengard-controller",
    "crates/isengard-agent",
    "crates/isengard-proto",
    "crates/isengard-storage",
    "crates/isengard-plugins/updater",
    "crates/isengard-plugins/dashboard",
    "crates/isengard-plugins/notifier",
    "crates/isengard-plugins/networking-none",
]

[workspace.package]
version = "0.1.0-alpha"
edition = "2024"
rust-version = "1.86"
license = "MIT"
authors = ["Dirdmaster"]
repository = "https://github.com/Dirdmaster/isengard"
homepage = "https://isengard.app"

[workspace.dependencies]
# async runtime
tokio = { version = "1.42", features = ["full"] }
async-trait = "0.1.83"

# plugin registration
inventory = "0.3.15"

# serialization
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"

# errors
anyhow = "1.0.94"
thiserror = "2.0.6"

# CLI
clap = { version = "4.5.23", features = ["derive", "env"] }

# logging
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }

# gRPC + protobuf
tonic = "0.12.3"
tonic-build = "0.12.3"
tonic-reflection = "0.12.3"
prost = "0.13.4"
prost-types = "0.13.4"
tower = "0.5.2"
tokio-stream = "0.1.17"
http = "1"

# storage
sqlx = { version = "0.8.2", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "macros", "migrate", "chrono"] }
ulid = { version = "1.1.3", features = ["serde"] }
chrono = { version = "0.4.39", default-features = false, features = ["serde", "clock"] }

# HTTP server (dashboard)
axum = { version = "0.8.1", default-features = false, features = ["http1", "http2", "tokio", "json", "ws", "macros", "query"] }

# embedded static assets (dashboard bundle)
rust-embed = { version = "8.5.0", features = ["compression"] }

# mime type detection for embedded asset serving
mime_guess = "2.0.5"

# crypto helpers
subtle = "2.6.1"

# system info
hostname = "0.4.0"

# docker
bollard = { version = "0.18.1", default-features = false, features = ["ssl", "http", "pipe"] }

# HTTP client (used by updater to query registries)
reqwest = { version = "0.12.9", default-features = false, features = ["rustls-tls", "json"] }

# base64 (decode docker config auth blobs)
base64 = "0.22.1"

# user dirs (locate ~/.docker/config.json cross-platform)
dirs = "6.0.0"

# futures utilities (consume bollard pull streams)
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }

# tempfile (test helpers)
tempfile = "3.14.0"

# HTTP mock server for tests
wiremock = "0.6.2"

# internal — path + version so cargo-deny doesn't flag these as wildcard deps
isengard-core = { path = "crates/isengard-core", version = "0.1.0-alpha" }
isengard-controller = { path = "crates/isengard-controller", version = "0.1.0-alpha" }
isengard-agent = { path = "crates/isengard-agent", version = "0.1.0-alpha" }
isengard-proto = { path = "crates/isengard-proto", version = "0.1.0-alpha" }
isengard-storage = { path = "crates/isengard-storage", version = "0.1.0-alpha" }
isengard-plugin-updater = { path = "crates/isengard-plugins/updater", version = "0.1.0-alpha" }
isengard-plugin-notifier = { path = "crates/isengard-plugins/notifier", version = "0.1.0-alpha" }
isengard-plugin-dashboard = { path = "crates/isengard-plugins/dashboard", version = "0.1.0-alpha" }
isengard-plugin-networking-none = { path = "crates/isengard-plugins/networking-none", version = "0.1.0-alpha" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
