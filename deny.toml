[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # rustls-pemfile is unmaintained; transitive via bollard 0.18.1.
    # We don't use rustls-pemfile directly. Bollard 0.19+ may swap it; revisit on next bollard bump.
    # https://rustsec.org/advisories/RUSTSEC-2025-0134
    "RUSTSEC-2025-0134",

    # protobuf 2.28.0 stack overflow on untrusted input. Pulled in transitively
    # via pingora-core 0.8 → prometheus 0.13 → protobuf 2.28. We don't expose
    # this protobuf parser to untrusted input (our protobuf use is via prost
    # for the controller↔agent gRPC). Fix waits on upstream prometheus bump.
    # https://rustsec.org/advisories/RUSTSEC-2024-0437
    "RUSTSEC-2024-0437",

    # derivative 2.2.0 is unmaintained. Pulled in transitively via pingora-core
    # 0.8. No safe upgrade available; alternatives (derive_more, derive-where,
    # educe) require pingora's own dep change. Revisit on next pingora bump.
    # https://rustsec.org/advisories/RUSTSEC-2024-0388
    "RUSTSEC-2024-0388",

    # daemonize is unmaintained (last activity June 2023). Pulled in transitively
    # via pingora-core 0.8 for its optional daemonization mode (we don't use it
    # — `conf.daemon` defaults to false). Revisit on next pingora bump.
    # https://rustsec.org/advisories/RUSTSEC-2025-0069
    "RUSTSEC-2025-0069",

    # hickory-proto 0.25.x: amplified CPU cost during DNS message encoding when
    # an attacker can send messages with many records. Fix lands in 0.26.1 but
    # that requires Rust 1.88; the workspace MSRV is 1.86 and bumping it would
    # cascade clippy-on-1.88+ lints across the codebase. Mitigated by
    # deployment shape: the v0.3b resolver binds to a LAN interface (default
    # 127.0.0.1:5300, prod compose binds 53/udp on the controller host only),
    # client traffic comes from operator-owned hosts, not the public internet.
    # Revisit when bumping MSRV to 1.88+ for an unrelated reason.
    # https://rustsec.org/advisories/RUSTSEC-2026-0119
    "RUSTSEC-2026-0119",

    # hickory-proto 0.25.x: NSEC3 closest-encloser proof validation can enter
    # an unbounded loop on cross-zone responses. The bug is only reachable
    # through `DnssecDnsHandle` when built with `dnssec-ring` or
    # `dnssec-aws-lc-rs`. We pin `default-features = false` and only enable
    # `resolver` on hickory-server, so DNSSEC validation is not compiled in;
    # the controller is also an authoritative server (it never recursively
    # validates upstream responses), which is the path the advisory covers.
    # Revisit alongside the MSRV bump that lets us move to 0.26.x.
    # https://rustsec.org/advisories/RUSTSEC-2026-0118
    "RUSTSEC-2026-0118",
]

[licenses]
# anything not in `allow` is denied (per cargo-deny 0.14+; the old `unlicensed` key was removed in PR #611)
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
