name: CI

on:
  push:
    branches: [main, next, "feat/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: lint (fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build

      # cargo clippy compiles the workspace, which runs the dashboard
      # plugin's build.rs (it shells out to `bun run build` for the Nuxt
      # bundle). Without bun the lint job panics before any clippy lints
      # actually run. Keep this in sync with build + test jobs.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo doc (warnings as errors)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --document-private-items

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: cargo build
        run: cargo build --workspace

  test:
    name: test (nextest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: cargo nextest
        run: cargo nextest run --workspace --profile ci

  migrations:
    # Migrations are byte-immutable once shipped: sqlx checksums each file
    # in `_sqlx_migrations` on first apply and refuses to boot if the
    # on-disk content drifts. PR #287 (lexicon doc sweep) edited a single
    # comment in `0028_stack_manifest.sql`; the next `isd upgrade` looped
    # on `migration 28 was previously applied but has been modified` and
    # required a manual `isd restore`. This job blocks that class of bug
    # at PR time by failing if any migration file <= the latest applied
    # version diverges from the base ref.
    name: migrations immutable
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject edits to shipped migration files
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: bash scripts/ci/check_migrations_immutable.sh "origin/${BASE_REF}"

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
