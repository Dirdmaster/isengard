name: Release (daemon)

# v0.6.0 distribution split:
#
# The operator-facing `isd` binary is shipped via cargo-dist
# (`.github/workflows/release.yml`, regenerated by `dist generate`). It
# owns the GitHub Release create + the `isd` artifact matrix + the shell
# installer + the Homebrew formula.
#
# This workflow handles everything cargo-dist DOES NOT touch:
#
#   - the fleet-side `isengard` daemon static-musl binary, built by
#     `binaries.yml` (which after v0.6.0 only builds the daemon, not isd).
#   - the daemon docker images (`isengard-agent`, `isengard-controller`)
#     pushed to ghcr.io by `docker.yml`.
#
# Triggers mirror the pre-v0.6.0 `release.yml`:
#
#   1. `workflow_dispatch` with bump=patch|minor|major. Computes the next
#      version from the latest tag, creates + pushes the tag, then drives
#      the rest. Note that cargo-dist's `release.yml` ALSO fires on that
#      tag push, so dispatching here drives both pipelines.
#
#   2. `push: tags: ['v*']`. Used when you tag manually
#      (`git tag v0.6.1 && git push origin v0.6.1`). Skips version
#      computation and uses the tag name directly. cargo-dist's
#      `release.yml` fires on the same push and creates the Release;
#      this workflow's `gh release view` is the safety-net idempotent
#      fallback for the case where cargo-dist hasn't yet finished its
#      create step when the daemon jobs upload.
#
# Both paths converge on: ensure-release-exists, then call binaries.yml +
# docker.yml as reusable workflows (sequential, no race; that race was
# the 2026-05-11 bug).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${{ github.ref_name }}"
            echo "Resolved (push) version: $version"
          else
            tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            current="${tag#v}"
            IFS='.' read -r major minor patch <<< "$current"
            case "${{ inputs.bump }}" in
              patch) patch=$((patch + 1)) ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              major) major=$((major + 1)); minor=0; patch=0 ;;
            esac
            version="v${major}.${minor}.${patch}"
            echo "Computed (dispatch) version: $version (was: $tag)"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$version"
            git push origin "$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Ensure GitHub Release exists (idempotent safety net)
        # cargo-dist's release.yml normally creates the release first.
        # We retry-with-delay to give it a chance, then create the
        # release ourselves if cargo-dist hasn't (workflow_dispatch path,
        # or cargo-dist failed). The daemon uploads below need the
        # release object to exist.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          for attempt in 1 2 3 4 5; do
            if gh release view "$version" >/dev/null 2>&1; then
              echo "Release $version exists (attempt $attempt)"
              exit 0
            fi
            echo "Release $version not yet created (attempt $attempt), waiting 15s"
            sleep 15
          done
          echo "cargo-dist did not create the release; creating it here"
          gh release create "$version" \
            --title "$version" \
            --generate-notes

  docker:
    needs: release
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.release.outputs.version }}
    permissions:
      contents: read
      packages: write

  binaries:
    needs: release
    uses: ./.github/workflows/binaries.yml
    with:
      version: ${{ needs.release.outputs.version }}
    permissions:
      contents: write

  docker-isd:
    needs: release
    uses: ./.github/workflows/docker-isd.yml
    with:
      version: ${{ needs.release.outputs.version }}
    permissions:
      contents: read
      packages: write
