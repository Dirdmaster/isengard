name: Docker

on:
  push:
    branches: ["next"]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - ".github/workflows/docker.yml"
    tags: ["v*"]
  workflow_call:
    inputs:
      version:
        description: Version tag (e.g. v0.2.0)
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        target:
          - { suffix: "agent",      cmd: "agent" }
          - { suffix: "controller", cmd: "controller" }

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/isengard-${{ matrix.target.suffix }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}},value=${{ inputs.version || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version || github.ref_name }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target.suffix }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-${{ matrix.target.suffix }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.target.suffix }}
