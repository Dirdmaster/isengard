name: Binaries

# Builds the static (musl) Linux `isengard` daemon binary and uploads it
# to the GitHub Release. The operator CLI `isd` is NOT built here as of
# v0.6.0: cargo-dist (`.github/workflows/release.yml`) owns the `isd`
# matrix (darwin-arm64, darwin-x86_64, linux-x86_64-gnu, linux-aarch64-gnu)
# plus the shell installer and the Homebrew formula.
#
# Why we keep the daemon build separate from cargo-dist:
#   - `isengard` depends on Pingora (BoringSSL via boring-sys), which needs
#     a real musl cross-toolchain. Debian's `musl-tools` is a gcc wrapper
#     that rejects `-m64` and the asm path zstd-sys uses. We build inside
#     the `messense/rust-musl-cross` container, the same image the
#     Dockerfile uses. cargo-dist targets gnu-by-default and folding the
#     daemon in would fight that.
#   - arm64 daemon is intentionally OMITTED: BoringSSL bindgen can't find
#     `bits/libc-header-start.h` inside the `aarch64-musl` container
#     because libclang picks up the host's stdint.h instead of the
#     cross-toolchain's. Restore arm64 when we have a working
#     BINDGEN_EXTRA_CLANG_ARGS recipe.
#
# Trigger: workflow_call from `release-daemon.yml`. The direct
# `push: tags: ['v*']` trigger was removed 2026-05-11 because it raced
# the release-create step.

on:
  workflow_call:
    inputs:
      version:
        description: Version tag (e.g. v0.6.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Version tag (e.g. v0.6.0) for manual builds
        required: true
        type: string

permissions:
  contents: write   # needed to upload to release

jobs:
  # ---------------------------------------------------------------------------
  # `isengard` Linux musl builds (BoringSSL path: container).
  # ---------------------------------------------------------------------------
  build-isengard-linux:
    name: Build isengard-${{ matrix.target }}
    runs-on: ubuntu-latest
    container:
      image: messense/rust-musl-cross:${{ matrix.musl-cross-tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            musl-cross-tag: x86_64-musl
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version || github.ref }}

      - name: Mark workspace safe for git (container ownership)
        # gh release upload calls git internally to detect the repo;
        # the container's file ownership doesn't match the runner's
        # uid, which trips git's "dubious ownership" check.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install protoc 27.x
        run: |
          # Pingora itself doesn't need protoc, but isengard pulls in
          # isengard-proto via the controller crate. The container's distro
          # protoc is too old for proto3 optional, so install upstream 27.x.
          PROTOC_VERSION=27.3
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          unzip -q /tmp/protoc.zip -d /usr/local
          rm /tmp/protoc.zip
          protoc --version

      - name: Install bun (dashboard build script)
        run: |
          # The dashboard plugin's build.rs runs `bun install` + `bun run build`
          # to generate the embedded Nuxt bundle.
          curl -fsSL https://bun.sh/install | bash
          ln -sf "$HOME/.bun/bin/bun" /usr/local/bin/bun
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          bun --version

      - name: Build isengard
        # `ISENGARD_RELEASE_VERSION` is read by `crates/isengard/build.rs`
        # and baked into the binary as `ISENGARD_BUILD_VERSION`.
        env:
          ISENGARD_RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          cargo build --release --target ${{ matrix.target }} --bin isengard

      - name: Strip binary
        run: |
          BINARY="target/${{ matrix.target }}/release/isengard"
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            aarch64-linux-musl-strip "$BINARY" || strip "$BINARY" || true
          else
            x86_64-linux-musl-strip "$BINARY" || strip "$BINARY" || true
          fi

      - name: Verify static linking
        run: |
          BINARY="target/${{ matrix.target }}/release/isengard"
          file "$BINARY" || true
          if ldd "$BINARY" 2>&1 | grep -q "not a dynamic executable"; then
            echo "OK: statically linked"
          elif ldd "$BINARY" 2>&1 | grep -q "statically linked"; then
            echo "OK: statically linked"
          else
            echo "WARNING: binary may not be fully static"
            ldd "$BINARY" 2>&1 || true
          fi

      - name: Package binary
        id: package
        run: |
          BINARY="target/${{ matrix.target }}/release/isengard"
          ARTIFACT_NAME="isengard-${{ matrix.target }}"
          mkdir -p dist
          cp "$BINARY" "dist/$ARTIFACT_NAME"
          sha256sum "dist/$ARTIFACT_NAME" > "dist/$ARTIFACT_NAME.sha256"
          echo "name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        if: github.event_name == 'push' || github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gh is not in the messense container; install it from GitHub releases.
          if ! command -v gh >/dev/null 2>&1; then
            GH_VERSION=2.62.0
            curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" -o /tmp/gh.tar.gz
            tar -xzf /tmp/gh.tar.gz -C /tmp
            cp "/tmp/gh_${GH_VERSION}_linux_amd64/bin/gh" /usr/local/bin/gh
            rm -rf /tmp/gh.tar.gz "/tmp/gh_${GH_VERSION}_linux_amd64"
          fi
          VERSION="${{ inputs.version || github.ref_name }}"
          gh release upload "$VERSION" \
            "dist/${{ steps.package.outputs.name }}" \
            "dist/${{ steps.package.outputs.name }}.sha256" \
            --clobber

      - name: Upload as workflow artifact (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}*
          retention-days: 30
