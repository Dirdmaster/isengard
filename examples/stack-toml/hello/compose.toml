# Stack-file compose.toml. Wrapper shape (2026-05-15 one-file stack
# model): a top-level `[services.<name>]` table per service, plus
# top-level keys like `name` and `secrets` beside it. The operator-side
# `isd deploy` converts this to YAML before shipping to the agent
# (agent never sees TOML).
#
# Equivalent docker-compose YAML:
#   name: hello
#   services:
#     web:
#       image: nginx:alpine
#       ports: ["18080:80"]
#       labels: { isengard.expose: "hello.example.com" }

name = "hello"

[services.web]
image = "nginx:alpine"
ports = ["18080:80"]
labels = { "isengard.expose" = "hello.example.com" }
