# A second stack to demonstrate `isd deploy --all`: from the parent
# `examples/stack-toml/` dir, `isd deploy --all` walks every immediate
# subdir and ships each one that has a `stack.toml`.
#
# This stack also exercises the `secrets = [...]` binding. Phase 0.13's
# secrets list is per-fleet; the secret must already exist on the
# controller. If `grafana_admin_password` is not present, the POST
# returns 422 with `{"error":"unknown secrets","missing":[...]}`.

name = "monitoring"
fleet = "default"
compose = ["compose.toml"]
strategy = "rolling"
secrets = ["grafana_admin_password"]

[[hooks]]
on = "pre-deploy"
cmd = ["sh", "-c", "echo 'monitoring pre-deploy'"]
